    // TOPLAMA İŞLEMİ ÜRETİCİSİ
    function generateAdditionProblem(withCarry = true) {
      let n1, n2, ones1, ones2;
      if (withCarry) {
        ones1 = Math.floor(Math.random() * 6) + 4; // 4..9
        const minOnes2 = 10 - ones1;
        ones2 = Math.floor(Math.random() * (9 - minOnes2 + 1)) + minOnes2;
        const tens1 = Math.floor(Math.random() * 4) + 1;
        const tens2 = Math.floor(Math.random() * 4) + 1;
        n1 = tens1 * 10 + ones1;
        n2 = tens2 * 10 + ones2;
      } else {
        ones1 = Math.floor(Math.random() * 5) + 1; // 1..5
        ones2 = Math.floor(Math.random() * (9 - ones1));
        const tens1 = Math.floor(Math.random() * 4) + 1;
        const tens2 = Math.floor(Math.random() * 4) + 1;
        n1 = tens1 * 10 + ones1;
        n2 = tens2 * 10 + ones2;
      }
      const sum = n1 + n2;
      const onesSum = (n1 % 10) + (n2 % 10);
      const carry = onesSum >= 10 ? 1 : 0;
      const tensSum = Math.floor(n1 / 10) + Math.floor(n2 / 10) + carry;

      return {
        n1,
        n2,
        sum,
        ones1: n1 % 10,
        ones2: n2 % 10,
        tens1: Math.floor(n1 / 10),
        tens2: Math.floor(n2 / 10),
        onesSum,
        carry,
        onesDigit: onesSum % 10,
        tensSum
      };
    }

    // ÇIKARMA İŞLEMİ ÜRETİCİSİ
    function generateSubtractionProblem(withBorrow = true) {
      let n1, n2;
      if (withBorrow) {
        const ones1 = Math.floor(Math.random() * 5); // 0..4
        const ones2 = Math.floor(Math.random() * (9 - (ones1 + 1) + 1)) + (ones1 + 1); // > ones1
        const tens1 = Math.floor(Math.random() * 4) + 4; // 4..7
        const tens2 = Math.floor(Math.random() * (tens1 - 2)) + 1;
        n1 = tens1 * 10 + ones1;
        n2 = tens2 * 10 + ones2;
      } else {
        const ones2 = Math.floor(Math.random() * 6);
        const ones1 = ones2 + Math.floor(Math.random() * (9 - ones2));
        const tens1 = Math.floor(Math.random() * 4) + 3;
        const tens2 = Math.floor(Math.random() * (tens1 - 1)) + 1;
        n1 = tens1 * 10 + ones1;
        n2 = tens2 * 10 + ones2;
      }
      const diff = n1 - n2;
      const needsBorrow = (n1 % 10) < (n2 % 10);

      return {
        n1,
        n2,
        diff,
        ones1: n1 % 10,
        ones2: n2 % 10,
        tens1: Math.floor(n1 / 10),
        tens2: Math.floor(n2 / 10),
        needsBorrow,
        borrowedTens1: Math.floor(n1 / 10) - 1,
        borrowedOnes1: (n1 % 10) + 10,
        onesDiff: ((n1 % 10) + (needsBorrow ? 10 : 0)) - (n2 % 10),
        tensDiff: (Math.floor(n1 / 10) - (needsBorrow ? 1 : 0)) - Math.floor(n2 / 10)
      };
    }

    function setAdditionPracticeType(type) {
      recordActivity();
      additionPracticeType = type;
      nextAdditionProblem();
    }

    function nextAdditionProblem() {
      recordActivity();
      additionCurrentProblem = generateAdditionProblem(additionPracticeType === 'with_carry');
      additionCurrentStep = 'ones';
      additionUserOnes = '';
      additionUserTens = '';
      additionCarryActive = false;
      const boardEl = document.getElementById('interactiveAdditionSection');
      if (boardEl) {
        boardEl.innerHTML = buildAdditionBoardHtml();
      } else {
        renderMathAddition();
      }
    }

    function getAdditionStepChoices(prob, step) {
      if (step === 'ones') {
        const correct = prob.onesDigit;
        const set = new Set([correct]);
        while (set.size < 4) {
          const r = Math.floor(Math.random() * 10);
          set.add(r);
        }
        return Array.from(set).sort((a, b) => a - b);
      } else {
        const correct = prob.tensSum;
        const set = new Set([correct]);
        while (set.size < 4) {
          const r = Math.max(1, correct + Math.floor(Math.random() * 5) - 2);
          set.add(r);
        }
        return Array.from(set).sort((a, b) => a - b);
      }
    }

    function handleAdditionStepAnswer(val) {
      recordActivity();
      const prob = additionCurrentProblem;
      if (additionCurrentStep === 'ones') {
        if (val === prob.onesDigit) {
          playChimeSound('correct');
          additionUserOnes = String(val);
          if (prob.carry === 1) {
            additionCarryActive = true;
            speakTurkish("Harika! " + prob.ones1 + " artı " + prob.ones2 + " eşittir " + prob.onesSum + ". " + prob.onesDigit + "'i yazdık, elde var 1 onluk!");
          } else {
            speakTurkish("Aferin! " + prob.ones1 + " artı " + prob.ones2 + " eşittir " + prob.onesDigit + ".");
          }
          additionCurrentStep = 'tens';
          const boardEl = document.getElementById('interactiveAdditionSection');
          if (boardEl) boardEl.innerHTML = buildAdditionBoardHtml();
          else renderMathAddition();
        } else {
          playChimeSound('wrong');
          recordParentActivityLog('math_addition', false, `${prob.n1} + ${prob.n2} İşlemi (Birler Basamağı)`, `${prob.ones1} + ${prob.ones2} için doğru rakam ${prob.onesDigit} iken ${val} seçti`);
          speakTurkish("Tekrar dene! " + prob.ones1 + " ile " + prob.ones2 + " toplanırsa kaç eder?");
        }
      } else if (additionCurrentStep === 'tens') {
        if (val === prob.tensSum) {
          playChimeSound('fanfare');
          additionUserTens = String(val);
          additionCurrentStep = 'done';
          additionScore += 10;
          additionStreak++;
          unlockBadge('math_addition_hero');
          recordParentActivityLog('math_addition', true, `${prob.n1} + ${prob.n2} = ${prob.sum} (${prob.carry ? 'Eldeli' : 'Eldesiz'} Toplama)`, `Birler ve onlar basamağını adım adım doğru topladı (+10 Puan)`);
          speakTurkish("Tebrikler! Sonuç " + prob.sum + "! Harika topladın.");
          const boardEl = document.getElementById('interactiveAdditionSection');
          if (boardEl) boardEl.innerHTML = buildAdditionBoardHtml();
          else renderMathAddition();
        } else {
          playChimeSound('wrong');
          recordParentActivityLog('math_addition', false, `${prob.n1} + ${prob.n2} İşlemi (Onlar Basamağı)`, `Onlukların toplamı ${prob.tensSum} iken ${val} seçti`);
          speakTurkish("Onlukları tekrar topla: " + (additionCarryActive ? "1 elde artı " : "") + prob.tens1 + " artı " + prob.tens2 + " kaç eder?");
        }
      }
    }

    function getSubtractionStepChoices(prob, step, hasBorrowed) {
      if (step === 'ones') {
        const correct = prob.onesDiff;
        const set = new Set([correct]);
        while (set.size < 4) {
          const r = Math.floor(Math.random() * 10);
          set.add(r);
        }
        return Array.from(set).sort((a, b) => a - b);
      } else {
        const correct = prob.tensDiff;
        const set = new Set([correct]);
        while (set.size < 4) {
          const r = Math.max(0, correct + Math.floor(Math.random() * 5) - 2);
          set.add(r);
        }
        return Array.from(set).sort((a, b) => a - b);
      }
    }

              badge: "🟢 1. SEVİYE • ONLUK BOZMASIZ ÇIKARMA",
              title: "Doğal Sayılarla Çıkarma",
              prompt: `${n1} - ${n2} işleminin sonucu kaçtır?`,
              visual: `<div style="font-size:28px;font-weight:900;letter-spacing:4px;line-height:1.2;">  ${n1}<br>- ${n2}<br>----<br>  ❓</div>`,
              correct: String(diff),
              options: shuffleArray([String(diff), String(diff + 10), String(diff - 2), String(diff + 1)]),
              explanation: `Birler: ${ones1} - ${ones2} = ${ones1 - ones2}. Onlar: ${tens1} - ${tens2} = ${tens1 - tens2}. Sonuç: ${diff}.`
            };
          } else if (level === 'medium') {
            // Onluk bozmalı çıkarma
            const ones1 = Math.floor(Math.random() * 5);
            const ones2 = Math.floor(Math.random() * 4) + 6;
            const tens1 = Math.floor(Math.random() * 4) + 4;
            const tens2 = Math.floor(Math.random() * (tens1 - 1)) + 1;
            const n1 = tens1 * 10 + ones1;
            const n2 = tens2 * 10 + ones2;
            const diff = n1 - n2;
            q = {
              badge: "🔴 2. SEVİYE • ONLUK BOZMALI ÇIKARMA",
              title: "Komşudan Onluk Bozarak Çıkarma",
              prompt: `${n1} - ${n2} onluk bozmalı çıkarma işleminin sonucu kaçtır?`,
              visual: `<div style="font-size:28px;font-weight:900;letter-spacing:4px;line-height:1.2;">  ${n1}<br>- ${n2}<br>----<br>  ❓</div>`,
              correct: String(diff),
              options: shuffleArray([String(diff), String(diff + 10), String(diff - 10), String(diff + 2)]),
              explanation: `${ones1}'den ${ones2} çıkmaz! Komşudan 1 onluk aldık: ${ones1 + 10} - ${ones2} = ${(ones1 + 10) - ones2}. Onlar basamağında ${tens1 - 1} kaldı: ${tens1 - 1} - ${tens2} = ${(tens1 - 1) - tens2}. Sonuç: ${diff}.`
            };
          } else {
            // Karışık & Verilmeyen Eksilen / Çıkan
            const isMissing = Math.random() > 0.5;
            if (isMissing) {
              const diff = Math.floor(Math.random() * 25) + 15;
              const sub = Math.floor(Math.random() * 25) + 12;
              const total = diff + sub;
              q = {
                badge: "🏆 3. SEVİYE • VERİLMEYEN EKSİLENİ BULMA",
                title: "Çıkarma İşleminde Verilmeyeni Bulma",
                prompt: `❓ - ${sub} = ${diff} işleminde verilmeyen eksilen sayı kaçtır?`,
                visual: `<div style="font-size:24px;font-weight:900;letter-spacing:2px;color:#fde047;">[ ❓ ] - ${sub} = ${diff}</div>`,
                correct: String(total),
                options: shuffleArray([String(total), String(total - 10), String(Math.abs(diff - sub)), String(total + 5)]),
                explanation: `Eksileni bulmak için çıkan ile fark toplanır: ${diff} + ${sub} = ${total}.`
              };
            } else {
              const tens1 = Math.floor(Math.random() * 4) + 4;
              const tens2 = Math.floor(Math.random() * (tens1 - 1)) + 1;
              const n1 = tens1 * 10 + Math.floor(Math.random() * 10);
              const n2 = tens2 * 10 + Math.floor(Math.random() * 10);
              const diff = n1 - n2;
              q = {
                badge: "🏆 3. SEVİYE • KARIŞIK ÇIKARMA",
                title: "2. Sınıf Maarif Modeli Çıkarma",
                prompt: `${n1} - ${n2} işleminin sonucu kaçtır?`,
                visual: `<div style="font-size:28px;font-weight:900;letter-spacing:4px;line-height:1.2;">  ${n1}<br>- ${n2}<br>----<br>  ❓</div>`,
                correct: String(diff),
                options: shuffleArray([String(diff), String(diff + 10), String(diff - 10), String(diff + 1)]),
                explanation: `${n1} sayısından ${n2} çıkarıldığında fark ${diff} olur.`
              };
            }
          }
        } else if (type === 'multiplication') {
          const f1 = (level === 'easy') ? (Math.floor(Math.random() * 5) + 1) : (Math.floor(Math.random() * 7) + 2);
          const f2 = (level === 'easy') ? [1, 2, 5][Math.floor(Math.random() * 3)] : (Math.floor(Math.random() * 4) + 2);
          const product = f1 * f2;
          q = {
            badge: "✖️ 2. SINIF ÇARPMA İŞLEMİ",
            title: "Tekrarlı Toplama ve Kat Anlamı",
            prompt: `${f1} tane ${f2} (${f1} × ${f2}) kaç eder?`,
            visual: `<div style="font-size:32px;font-weight:900;color:#fde047;">${f1} × ${f2} = ❓</div>`,
            correct: String(product),
            options: shuffleArray([String(product), String(product + f2), String(Math.max(1, product - f2)), String(product + 2)]),
            explanation: `${f1} tane ${f2} yan yana toplanırsa: ${Array(f1).fill(f2).join(' + ')} = ${product}.`
          };
        } else if (type === 'division') {
          const divisor = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
          const quotient = Math.floor(Math.random() * 7) + 2;
          const dividend = divisor * quotient;
          q = {
            badge: "➗ 2. SINIF BÖLME İŞLEMİ",
            title: "Eşit Paylaştırma ve Gruplama",
            prompt: `${dividend} sayısı ${divisor} eşit parçaya bölünürse (${dividend} ÷ ${divisor}) sonuç kaç olur?`,
            visual: `<div style="font-size:32px;font-weight:900;color:#38bdf8;">${dividend} ÷ ${divisor} = ❓</div>`,
            correct: String(quotient),
            options: shuffleArray([String(quotient), String(quotient + 1), String(Math.max(1, quotient - 1)), String(quotient + 2)]),
            explanation: `${dividend} nesne ${divisor} kişiye eşit paylaştırılırsa her birine ${quotient} nesne düşer (${dividend} ÷ ${divisor} = ${quotient}).`
          };
        }
        questions.push(q);
      }
      return questions;
    }

    function startMathQuiz(type, level = 'mixed') {
      recordActivity();
      mathQuizActiveType = type;
      mathQuizActiveLevel = level;
      mathQuizQuestions = generateMathQuizQuestions(type, level);
      mathQuizCurrentIndex = 0;
      mathQuizScore = 0;
      mathQuizFirstTry = 0;
      mathQuizWrongCurrent = 0;
      mathQuizAnswered = false;
      mathQuizWrongClicked = [];
      renderMathQuizScreen(type);
    }

            <button class="action-btn" style="background:${mathQuizActiveLevel === 'medium' ? typeMeta.color : '#1e293b'};color:${mathQuizActiveLevel === 'medium' ? '#0f172a' : '#fff'};font-size:11px;font-weight:900;padding:6px 10px;" onclick="startMathQuiz('${type}', 'medium')">

    function handleMathQuizAnswer(selectedOption) {
      recordActivity();
      if (mathQuizAnswered) return;
      const q = mathQuizQuestions[mathQuizCurrentIndex];
      if (!q) return;

      if (selectedOption === q.correct) {
        mathQuizAnswered = true;
        playChimeSound('fanfare');
        if (mathQuizWrongCurrent === 0) {
          mathQuizScore += 10;
          mathQuizFirstTry++;
          if (mathQuizActiveType === 'addition') unlockBadge('math_addition_hero');
          else if (mathQuizActiveType === 'subtraction') unlockBadge('math_subtraction_hero');
          else if (mathQuizActiveType === 'multiplication') unlockBadge('math_mult_hero');
          else if (mathQuizActiveType === 'division') unlockBadge('math_div_hero');
        } else {
          mathQuizScore += 5;
        }
        recordParentActivityLog('math_' + mathQuizActiveType, true, `${q.title}: ${q.prompt}`, `Doğru cevap: ${q.correct}`);
        speakTurkish("Tebrikler! Doğru cevap " + q.correct);
        renderMathQuizScreen(mathQuizActiveType);
      } else {
        playChimeSound('wrong');
        mathQuizWrongCurrent++;
        if (!mathQuizWrongClicked.includes(selectedOption)) {
          mathQuizWrongClicked.push(selectedOption);
        }
        recordParentActivityLog('math_' + mathQuizActiveType, false, `${q.title}: ${q.prompt}`, `Doğru: ${q.correct} | Seçilen: ${selectedOption}`);
        speakTurkish("Tekrar dikkatlice hesapla!");
        renderMathQuizScreen(mathQuizActiveType);
      }
    }

    function nextMathQuizQuestion() {
      recordActivity();
      mathQuizCurrentIndex++;
      mathQuizWrongCurrent = 0;
      mathQuizWrongClicked = [];
      mathQuizAnswered = false;
      renderMathQuizScreen(mathQuizActiveType);
    }

    ======================================================== */
    let multInteractiveProblem = null;

      const g = Math.floor(Math.random() * 4) + 2; // 2-5 grup
      const itemsPerGroup = Math.floor(Math.random() * 4) + 2; // 2-5 nesne
      return {
        groups: g,
        itemsPerGroup: itemsPerGroup,
        product: g * itemsPerGroup,
        repeatedSumText: Array(g).fill(itemsPerGroup).join(' + '),
        multText: `${g} × ${itemsPerGroup}`
      };
    }

    function formatClockTurkishText(h, m) {
      if (m === 0) return `Saat tam ${h}`;
      if (m === 30) return `Saat ${h} buçuk (${h}:30)`;
      if (m === 15) return `Saat ${h}'i çeyrek geçiyor (${h}:15)`;
      if (m === 45) {
        const nextH = h === 12 ? 1 : h + 1;
        return `Saat ${nextH}'e çeyrek var (${h}:45)`;
      }
      return `Saat ${h}:${m < 10 ? '0' + m : m}`;
    }

    function buildInteractiveClockSvg(h, m) {
      const hourAngle = ((h % 12) + m / 60) * 30;
      const minAngle = m * 6;
      const hRad = (hourAngle - 90) * (Math.PI / 180);
      const mRad = (minAngle - 90) * (Math.PI / 180);
      const hx = 110 + 46 * Math.cos(hRad);
      const hy = 110 + 46 * Math.sin(hRad);
      const mx = 110 + 72 * Math.cos(mRad);
      const my = 110 + 72 * Math.sin(mRad);

      let numbersSvg = '';
      for (let i = 1; i <= 12; i++) {
        const ang = (i * 30 - 90) * (Math.PI / 180);
        const nx = 110 + 82 * Math.cos(ang);
        const ny = 115 + 82 * Math.sin(ang);
        numbersSvg += `<text x="${nx}" y="${ny}" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="900">${i}</text>`;
      }

      return `
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="102" fill="#0f172a" stroke="#eab308" stroke-width="7"/>
          <circle cx="110" cy="110" r="92" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="3,6"/>
          ${numbersSvg}
          <!-- Yelkovan (Uzun Mavi Kol - Dakika) -->
          <line x1="110" y1="110" x2="${mx}" y2="${my}" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
          <!-- Akrep (Kısa Kırmızı Kol - Saat) -->
          <line x1="110" y1="110" x2="${hx}" y2="${hy}" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
          <circle cx="110" cy="110" r="7" fill="#fde047"/>
        </svg>
      `;
    }

    function generateNewClockTarget() {

      clockGameState.targetHour = hours[Math.floor(Math.random() * hours.length)];
      clockGameState.targetMinute = mins[Math.floor(Math.random() * mins.length)];
    }

      const html = `

    function adjustInteractiveClock(deltaH, deltaM) {
      let totalMins = clockGameState.hour * 60 + clockGameState.minute + deltaH * 60 + deltaM;
      while (totalMins <= 0) totalMins += 12 * 60;
      let newH = Math.floor(totalMins / 60) % 12;
      if (newH === 0) newH = 12;
      let newM = totalMins % 60;
      clockGameState.hour = newH;
      clockGameState.minute = newM;
      renderMathClock();
    }

        playChimeSound('correct');

          fb.innerHTML = `🎉 Harikasın! Saati tam doğru ayarladın! (+10 Puan & +2 ⭐)`;

    function getPetState() {
      try {
        const raw = localStorage.getItem(LINGO_PET_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const today = getTodayDateKey();
          if (parsed.questDate !== today) {
            parsed.questDate = today;
            parsed.quests = { rhythm: 0, math: 0, english: 0, chestClaimed: false };
          }
          return parsed;

      return {
        stars: 20,
        petId: 'cat',
        xp: 0,
        level: 1,
        accessories: [],
        avatarId: 'hero',
        unlockedAvatars: ['hero'],
        lastWheelDate: '',
        questDate: getTodayDateKey(),
        quests: { rhythm: 0, math: 0, english: 0, chestClaimed: false }
      };
    }

    function savePetState(state) {
      try {
        localStorage.setItem(LINGO_PET_STORAGE_KEY, JSON.stringify(state));
        updateHeaderStarUI();
        if (typeof scheduleMemoryMirrorSync === 'function') scheduleMemoryMirrorSync();
      } catch (e) {}
    }

      const st = getPetState();
      st.stars = (st.stars || 0) + amount;
      savePetState(st);
      if (showToast && typeof showUpdateToast === 'function') {
        showUpdateToast(`⭐ +${amount} Yıldız Kumbarana Eklendi! (Toplam: ${st.stars} ⭐)`);
      }
    }

    function updateDailyQuestProgress(category) {
      const st = getPetState();
      if (!st.quests) st.quests = { rhythm: 0, math: 0, english: 0, chestClaimed: false };
      if (category === 'math_rhythm' || category === 'rhythm_practice' || category === 'rhythm_exam') {
        st.quests.rhythm = Math.min(3, (st.quests.rhythm || 0) + 1);
      } else if (category && category.startsWith('math_')) {
        st.quests.math = Math.min(5, (st.quests.math || 0) + 1);
      } else if (category && category.startsWith('english_')) {
        st.quests.english = Math.min(5, (st.quests.english || 0) + 1);
      }
      savePetState(st);
    }

    function getPetSummaryForMenu() {
      const st = getPetState();

      const q = st.quests || { rhythm: 0, math: 0, english: 0 };
      const done = (q.rhythm >= 1 ? 1 : 0) + (q.math >= 3 ? 1 : 0) + (q.english >= 3 ? 1 : 0);
      return {
        petEmoji: st.level >= 3 ? petObj.evolvedEmoji : petObj.emoji,
        petName: petObj.name,
        level: st.level || 1,
        stars: st.stars || 0,
        questsDone: done,
        avatarEmoji: avObj.emoji
      };
    }

    function selectLingoPet(petId) {
      const st = getPetState();
      st.petId = petId;
      savePetState(st);
      renderPetAndWheelHub();
    }

    function buyPetItem(itemId) {
      const item = PET_ITEMS_SHOP.find(i => i.id === itemId);
      if (!item) return;
      const st = getPetState();
      if (st.stars < item.cost) {
        showUpdateToast(`⚠️ Yeterli yıldızın yok! (${item.cost} ⭐ gerekli, ders çalışarak kazanabilirsin)`);
        return;
      }
      st.stars -= item.cost;
      st.xp = (st.xp || 0) + item.xp;
      st.level = 1 + Math.floor(st.xp / 100);
      if ((itemId === 'glasses' || itemId === 'crown') && !(st.accessories || []).includes(item.emoji)) {
        st.accessories = [...(st.accessories || []), item.emoji];
      }
      savePetState(st);
      playChimeSound('correct');
      unlockBadge('pet_caretaker');
      speakTurkish('Teşekkür ederim! Çok mutlu oldum!');
      renderPetAndWheelHub();
    }

    function spinDailyWheel() {
      const st = getPetState();
      const today = getTodayDateKey();
      if (st.lastWheelDate === today) {
        showUpdateToast('🎡 Bugünkü şans çarkını zaten çevirdin! Yarın tekrar çevirebilirsin.');
        return;
      }
      const rewards = [15, 20, 25, 30, 50];
      const won = rewards[Math.floor(Math.random() * rewards.length)];
      st.stars = (st.stars || 0) + won;
      st.lastWheelDate = today;
      savePetState(st);
      playChimeSound('fanfare');
      unlockBadge('pet_caretaker');
      speakTurkish(`Harika! Şans çarkından ${won} yıldız kazandın!`);
      renderPetAndWheelHub();
      const resEl = document.getElementById('wheelSpinResult');
      if (resEl) resEl.innerHTML = `🎉 Tebrikler! Çarktan Tam <strong>+${won} ⭐ Yıldız</strong> Kazandın!`;
    }

    function claimDailyQuestChest() {
      const st = getPetState();
      const q = st.quests || { rhythm: 0, math: 0, english: 0, chestClaimed: false };
      if (q.chestClaimed) return;
      if (q.rhythm >= 1 && q.math >= 3 && q.english >= 3) {
        q.chestClaimed = true;
        st.stars = (st.stars || 0) + 30;
        savePetState(st);
        playChimeSound('fanfare');
        speakTurkish('Tebrikler! Günün görev sandığını açtın ve 30 yıldız kazandın!');
        renderPetAndWheelHub();
      } else {
        showUpdateToast('🔒 Sandığı açmak için 3 günlük görevi tamamlamalısın!');
      }
    }

    function selectOrBuyAvatar(avId) {
      const av = AVATAR_LIST.find(a => a.id === avId);
      if (!av) return;
      const st = getPetState();
      if (!st.unlockedAvatars) st.unlockedAvatars = ['hero'];
      if (st.unlockedAvatars.includes(avId)) {
        st.avatarId = avId;
        savePetState(st);
        renderPetAndWheelHub();
      } else if (st.stars >= av.cost) {
        st.stars -= av.cost;
        st.unlockedAvatars.push(avId);
        st.avatarId = avId;
        savePetState(st);
        playChimeSound('correct');
        showUpdateToast(`🎉 ${av.emoji} ${av.name} avatarı açıldı!`);
        renderPetAndWheelHub();
      } else {
        showUpdateToast(`⚠️ Bu avatar için ${av.cost} ⭐ gerekli!`);
      }
    }

    /* ========================================================
       YENİ MODÜL 4: EĞİTSEL OYUNLAR VE 2 KİŞİLİK DÜELLO MERKEZİ
       (1. Balon Patlatma, 2. 60 Saniye Şampiyonu, 3. 2 Kişilik Düello)
    ======================================================== */
    let funGamesTab = 'balloon'; // 'balloon' | 'time60' | 'duel'
    let balloonGameState = { score: 0, round: 1, prompt: '', correct: '', options: [] };
    let time60State = { active: false, timeLeft: 60, score: 0, bestScore: parseInt(localStorage.getItem('lingo_best_60s') || '0', 10), currentQ: null, timerId: null };
    let duelState = { p1Score: 0, p2Score: 0, turn: 1, round: 1, maxRounds: 6, currentQ: null };

    function generateQuickGameQuestion() {
      const types = ['math_add', 'math_sub', 'geo', 'eng'];
      const t = types[Math.floor(Math.random() * types.length)];
      if (t === 'math_add') {
        const a = Math.floor(Math.random() * 25) + 5;
        const b = Math.floor(Math.random() * 20) + 4;
        const ans = String(a + b);
        const opts = new Set([ans, String(a + b + 2), String(Math.max(1, a + b - 3)), String(a + b + 10)]);
        return { prompt: `➕ ${a} + ${b} = ?`, correct: ans, options: Array.from(opts).sort(() => Math.random() - 0.5) };
      } else if (t === 'math_sub') {
        const a = Math.floor(Math.random() * 30) + 18;
        const b = Math.floor(Math.random() * 14) + 3;
        const ans = String(a - b);
        const opts = new Set([ans, String(a - b + 2), String(Math.max(1, a - b - 2)), String(a - b + 5)]);
        return { prompt: `➖ ${a} - ${b} = ?`, correct: ans, options: Array.from(opts).sort(() => Math.random() - 0.5) };
      } else if (t === 'geo') {
        const gPool = [
          { prompt: '🎲 Küpün kaç yüzü vardır?', correct: '6 Yüzü', options: ['6 Yüzü', '4 Yüzü', '8 Yüzü', '3 Yüzü'] },
          { prompt: '🔺 Üçgenin kaç köşesi vardır?', correct: '3 Köşesi', options: ['3 Köşesi', '4 Köşesi', '0 Köşesi', '6 Köşesi'] },
          { prompt: '⚽ Top hangi geometrik cisimdir?', correct: 'Küre', options: ['Küre', 'Küp', 'Koni', 'Silindir'] },
          { prompt: '🍦 Dondurma külahı hangi cisimdir?', correct: 'Koni', options: ['Koni', 'Silindir', 'Kare Prizma', 'Küre'] },
          { prompt: '🥫 Konserve kutusu hangi cisimdir?', correct: 'Silindir', options: ['Silindir', 'Küp', 'Üçgen', 'Koni'] }
        ];
        const pick = gPool[Math.floor(Math.random() * gPool.length)];
        return { prompt: pick.prompt, correct: pick.correct, options: [...pick.options].sort(() => Math.random() - 0.5) };
      } else {
        const ePool = [
          { prompt: '🇬🇧 "Apple" ne demektir?', correct: 'Elma 🍎', options: ['Elma 🍎', 'Muz 🍌', 'Kedi 🐱', 'Okul 🏫'] },
          { prompt: '🇬🇧 "Dog" ne demektir?', correct: 'Köpek 🐶', options: ['Köpek 🐶', 'Kuş 🐦', 'Balık 🐟', 'Aslan 🦁'] },
          { prompt: '🇬🇧 "Sunny" hava nasıldır?', correct: 'Güneşli ☀️', options: ['Güneşli ☀️', 'Yağmurlu 🌧️', 'Karlı ❄️', 'Rüzgarlı 💨'] },
          { prompt: '🇬🇧 "Hospital" neresidir?', correct: 'Hastane 🏥', options: ['Hastane 🏥', 'Okul 🏫', 'Park 🛝', 'Fırın 🥖'] }
        ];
        const pick = ePool[Math.floor(Math.random() * ePool.length)];
        return { prompt: pick.prompt, correct: pick.correct, options: [...pick.options].sort(() => Math.random() - 0.5) };
      }
    }

      const fb = document.getElementById('balloonFeedback');
      if (selected === balloonGameState.correct) {

        btnEl.style.transform = 'scale(1.18)';

          fb.style.color = '#6ee7b7';

        if (balloonGameState.score >= 30) unlockBadge('duel_champion');

      } else {

    function start60SecChallenge() {
      time60State.active = true;
      time60State.timeLeft = 60;
      time60State.score = 0;
      time60State.currentQ = generateQuickGameQuestion();
      renderFunGamesHub('time60');
      time60State.timerId = setInterval(() => {
        time60State.timeLeft -= 1;
        const el = document.getElementById('time60Clock');
        if (el) el.textContent = time60State.timeLeft;
        if (time60State.timeLeft <= 0) {
          clearInterval(time60State.timerId);
          time60State.timerId = null;
          time60State.active = false;
          playChimeSound('fanfare');
          if (time60State.score > time60State.bestScore) {
            time60State.bestScore = time60State.score;
            localStorage.setItem('lingo_best_60s', String(time60State.bestScore));
            if (typeof scheduleMemoryMirrorSync === 'function') scheduleMemoryMirrorSync();
          }
          unlockBadge('duel_champion');
          recordParentMilestone('fun_games', '60 Saniye Şampiyonu', `${time60State.score} Puan`);
          renderFunGamesHub('time60');
        }
      }, 1000);
    }

    function answer60SecQuestion(selected) {
      if (!time60State.active) return;
      if (selected === time60State.currentQ.correct) {
        playChimeSound('correct');
        time60State.score += 10;
        addStarCoins(2, false);
      } else {
        playChimeSound('wrong');
      }
      time60State.currentQ = generateQuickGameQuestion();
      renderFunGamesHub('time60');
    }

    function answerDuelQuestion(selected) {
      if (selected === duelState.currentQ.correct) {
        playChimeSound('correct');
        if (duelState.turn === 1) duelState.p1Score += 10;
        else duelState.p2Score += 10;
        addStarCoins(2, false);
      } else {
        playChimeSound('wrong');
      }
      if (duelState.turn === 1) {
        duelState.turn = 2;
      } else {
        duelState.turn = 1;
        duelState.round += 1;
        if (duelState.round > duelState.maxRounds) {
          playChimeSound('fanfare');
          unlockBadge('duel_champion');
          recordParentMilestone('fun_games', '2 Kişilik Düello Maçı', `Mavi: ${duelState.p1Score} - Kırmızı: ${duelState.p2Score}`);
        }
      }
      duelState.currentQ = generateQuickGameQuestion();
      renderFunGamesHub('duel');
    }

    const correctDaysOrder = [
      { en: "Monday", tr: "Pazartesi" },
      { en: "Tuesday", tr: "Salı" },
      { en: "Wednesday", tr: "Çarşamba" },
      { en: "Thursday", tr: "Perşembe" },

    let userDaysOrder = [
      { en: "Wednesday", tr: "Çarşamba" },
      { en: "Monday", tr: "Pazartesi" },
      { en: "Friday", tr: "Cuma" },
      { en: "Tuesday", tr: "Salı" },
      { en: "Sunday", tr: "Pazar" },
      { en: "Thursday", tr: "Perşembe" },

    ];

    function renderDaysSort() {
      const html = `
        <div class="card">
          <div class="card-header-bar">
            <div class="card-title">📅 Haftanın Günlerini Sıraya Dizme Ödevi</div>
            <button class="reset-btn" onclick="resetDaysSort()">🔄 Sıralamayı Sıfırla</button>
          </div>
          <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">
            Haftanın günlerini Pazartesi'den Pazar'a doğru sıraya dizin. Yukarı (⬆️) ve Aşağı (⬇️) okları kullanarak yerlerini değiştirin.
          </p>

          <div id="daysListContainer">
            ${userDaysOrder.map((d, idx) => `
              <div class="sortable-item">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span style="font-weight:bold;color:var(--accent);width:24px;">${idx + 1}.</span>
                  <div>
                    <span style="font-weight:bold;font-size:15px;color:#fff;">${d.en}</span>
                    <span style="font-size:12px;color:var(--muted);margin-left:6px;">(${d.tr})</span>
                  </div>
                  <button style="background:none;border:none;cursor:pointer;font-size:14px;" onclick="speakText('${d.en}')">🔊</button>
                </div>
                <div class="sort-controls">
                  <button class="sort-btn" onclick="moveDayUp(${idx})"${idx === 0 ? ' disabled style="opacity:0.3"' : ''}>⬆️</button>
                  <button class="sort-btn" onclick="moveDayDown(${idx})"${idx === userDaysOrder.length - 1 ? ' disabled style="opacity:0.3"' : ''}>⬇️</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div id="daysSortFeedback" style="margin-top:14px;"></div>

          <button class="action-btn" style="width:100%;margin-top:14px;" onclick="checkDaysOrder()">
            Sıralamayı Kontrol Et ✅
          </button>
        </div>
      `;
      document.getElementById('appContent').innerHTML = html;
    }

    function moveDayUp(idx) {
      if (idx <= 0) return;
      const tmp = userDaysOrder[idx];
      userDaysOrder[idx] = userDaysOrder[idx - 1];
      userDaysOrder[idx - 1] = tmp;
      renderDaysSort();
    }

    function moveDayDown(idx) {
      if (idx >= userDaysOrder.length - 1) return;
      const tmp = userDaysOrder[idx];
      userDaysOrder[idx] = userDaysOrder[idx + 1];
      userDaysOrder[idx + 1] = tmp;
      renderDaysSort();
    }

    function resetDaysSort() {
      userDaysOrder = [
        { en: "Wednesday", tr: "Çarşamba" },
        { en: "Monday", tr: "Pazartesi" },
        { en: "Friday", tr: "Cuma" },
        { en: "Tuesday", tr: "Salı" },
        { en: "Sunday", tr: "Pazar" },
        { en: "Thursday", tr: "Perşembe" },
        { en: "Saturday", tr: "Cumartesi" }
      ];
      renderDaysSort();
    }

    function checkDaysOrder() {
      let isAllCorrect = true;
      let wrongCount = 0;
      for (let i = 0; i < correctDaysOrder.length; i++) {
        if (userDaysOrder[i].en !== correctDaysOrder[i].en) {
          isAllCorrect = false;
          wrongCount++;
        }
      }

      const fb = document.getElementById('daysSortFeedback');
      if (isAllCorrect) {
        recordParentActivityLog('english_units', `Haftanın Günlerini Sıraya Dizme Ödevi (Monday ➔ Sunday)`, true);
        recordParentMilestone(`📅 Haftanın Günlerini Sıraya Dizme Ödevini Hatasız Tamamladı`);
        unlockBadge('days_expert');
        playChimeSound('fanfare');
        speakText('Excellent! Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Perfect order!');
        fb.innerHTML = `<div class="feedback-banner success"><span>🎉 TEBRİKLER! Tüm günler tam sırasında: Monday ... Sunday!</span></div>`;
      } else {
        recordParentActivityLog('english_units', `Haftanın Günlerini Sıraya Dizme (${wrongCount} gün yanlış sırada)`, false);
        speakText('Some days are not in the right order. Try again.');
        fb.innerHTML = `<div class="feedback-banner error"><span>❌ Sıralamada ${wrongCount} gün yanlış yerde! Okları kullanarak düzeltin.</span></div>`;
      }
    }

    // 2. TESTİ BAŞLAT (Her başlatmada soru sırasını ve şıkların yerini karıştırır!)
    function startTopicQuiz(topicId) {
      if (!quizTopicBanks[topicId]) topicId = 'days';
      activeTopicId = topicId;

      const topic = quizTopicBanks[topicId];
      if (topic && Array.isArray(topic.questions)) {
        // Orijinal soru havuzunu ilk seferde yedekle
        if (!topic._baseQuestions) {
          topic._baseQuestions = topic.questions.map(q => ({
            ...q,
            options: Array.isArray(q.options) ? [...q.options] : undefined
          }));
        }

        // Eğer Büyük Karma Test (grand) ise tüm ünitelerin sorularından her seferinde rastgele 12 soru seç
        if (topicId === 'grand') {
          const allPools = ['days', 'school', 'greetings', 'body', 'family', 'house', 'city'];
          let combined = [...topic._baseQuestions];
          allPools.forEach(k => {
            const bank = quizTopicBanks[k];
            if (bank) {
              const src = bank._baseQuestions || bank.questions || [];
              combined = combined.concat(src);
            }
          });
          // Kelime+prompt bazında tekilleştir ve karıştır
          const seen = new Set();
          const uniquePool = [];
          shuffleArray(combined).forEach(q => {
            const key = (q.word || '') + '|' + (q.prompt || '');
            if (!seen.has(key) && q.direction !== 'SPEAKING') {
              seen.add(key);
              uniquePool.push({
                ...q,
                options: Array.isArray(q.options) ? shuffleArray(q.options) : undefined
              });
            }
          });
          topic.questions = uniquePool.slice(0, 12);
          topic.totalQuestions = topic.questions.length;
        } else {
          // Diğer tüm testlerde soruları ve şıkları her girişte yeniden karıştır
          topic.questions = shuffleArray(topic._baseQuestions).map(q => ({
            ...q,
            options: Array.isArray(q.options) ? shuffleArray(q.options) : undefined
          }));
        }
      }

      currentQuizIndex = 0;
      quizScore = 0;
      quizStreak = 0;
      quizBestStreak = 0;
      quizWrongInCurrent = 0;
      quizTotalFirstTryCorrect = 0;
      quizTotalMistakes = 0;
      quizWrongClicked = [];
      quizAnsweredCorrectly = false;
      renderActiveQuiz();
    }

    // SESLİ TELAFFUZ DEĞERLENDİRME VE MİKROFON FONKSİYONLARI
    function startChildVoiceRecognition(targetWord) {
      const micBtn = document.getElementById('quizMicBtn');
      const statusDiv = document.getElementById('quizSpeechStatus');
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (statusDiv) {
          statusDiv.innerHTML = `
            <div style="background:rgba(234,88,12,0.15);border:1px solid #f97316;color:#fdba74;padding:10px;border-radius:10px;font-size:12px;">
              🎙️ Tarayıcınızda otomatik mikrofon tanıma desteklenmiyor veya izin gerekli.
              <br><strong>Harika çalıştın!</strong> Kelimeyi sesli söylediysen aşağıdaki butona basıp puanını al:
            </div>`;
        }
        return;
      }

      try {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 3;

        if (micBtn) {
          micBtn.style.background = '#ef4444';
          micBtn.innerHTML = '🔴 Seni Dinliyorum... Şimdi Söyle!';
        }
        if (statusDiv) {
          statusDiv.innerHTML = `<span style="color:#fde047;font-weight:700;">🎙️ Konuşabilirsiniz: "${targetWord}" deyin...</span>`;
        }

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript.trim().toLowerCase();
          const targetClean = targetWord.trim().toLowerCase();
          console.log('Spoken:', transcript, 'Target:', targetClean);

          const isMatch = transcript.includes(targetClean) || 
                          targetClean.includes(transcript) || 
                          transcript.split(' ').some(w => targetClean.includes(w));

          if (isMatch) {
            handleChildPronunciationSuccess(transcript, targetWord);
          } else {
            if (statusDiv) {
              statusDiv.innerHTML = `
                <div style="background:rgba(248,113,113,0.15);border:1px solid #f87171;color:#f87171;padding:10px;border-radius:10px;font-size:12px;">
                  🤔 "${transcript}" duyuldu. Yaklaştın! Bir kez daha dene veya doğru söylediysen onayla:
                  <div style="display:flex;gap:8px;margin-top:8px;justify-content:center;">
                    <button class="action-btn" style="background:#2563eb;padding:6px 12px;font-size:11px;" onclick="startChildVoiceRecognition('${targetWord}')">
                      🔄 Tekrar Söyle
                    </button>
                    <button class="action-btn" style="background:#10b981;padding:6px 12px;font-size:11px;" onclick="confirmChildSpokeCorrectly('${targetWord}')">
                      👍 Doğru Söyledim (+10 Puan)
                    </button>
                  </div>
                </div>`;
            }
            if (micBtn) {
              micBtn.style.background = '#10b981';
              micBtn.innerHTML = '🎙️ Mikrofona Bas ve Tekrar Söyle';
            }
          }
        };

        recognition.onerror = function(event) {
          console.warn('Speech recognition error:', event.error);
          if (statusDiv) {
            statusDiv.innerHTML = `
              <div style="background:rgba(234,88,12,0.15);border:1px solid #f97316;color:#fdba74;padding:8px;border-radius:10px;font-size:12px;">
                🎙️ Kelimeyi yüksek sesle söylediysen butona basarak puanını alabilirsin!
              </div>`;
          }
          if (micBtn) {
            micBtn.style.background = '#10b981';
            micBtn.innerHTML = '🎙️ Mikrofona Bas ve Söyle!';
          }
        };

        recognition.onend = function() {
          if (micBtn && micBtn.innerHTML.includes('Seni Dinliyorum')) {
            micBtn.style.background = '#10b981';
            micBtn.innerHTML = '🎙️ Mikrofona Bas ve Söyle!';
          }
        };

        recognition.start();
      } catch(e) {
        console.error('Speech recognition start failed:', e);
      }
    }

    // CEVAP KONTROLÜ
    function handleQuizAnswer(selectedOption) {
      if (quizAnsweredCorrectly) return;
      const topic = quizTopicBanks[activeTopicId] || quizTopicBanks.days;
      const q = topic.questions[currentQuizIndex];

      if (selectedOption === q.correct) {
        // DOĞRU CEVAP!
        quizAnsweredCorrectly = true;
        speakText('Correct! ' + q.correct);
        recordParentActivityLog('english_quiz', true, `${topic.title}: ${q.word || q.prompt}`, `Doğru cevap: ${q.correct}`);
        if (quizWrongInCurrent === 0) {
          quizScore += 10;
          quizStreak += 1;
          if (quizStreak > quizBestStreak) quizBestStreak = quizStreak;
          quizTotalFirstTryCorrect += 1;
        } else {
          quizScore += 5;
          quizStreak = 0;
        }
        renderActiveQuiz();
        setTimeout(() => {
          if (quizAnsweredCorrectly) {
            advanceQuizQuestion();
          }
        }, 1400);
      } else {
        // YANLIŞ CEVAP!
        speakText('Try again');
        recordParentActivityLog('english_quiz', false, `${topic.title}: ${q.word || q.prompt}`, `Doğru: ${q.correct} | Seçilen: ${selectedOption}`);
        quizWrongInCurrent += 1;
        quizTotalMistakes += 1;
        quizStreak = 0;
        if (!quizWrongClicked.includes(selectedOption)) {
          quizWrongClicked.push(selectedOption);
        }
        renderActiveQuiz();
      }
    }

    function advanceQuizQuestion() {
      const topic = quizTopicBanks[activeTopicId] || quizTopicBanks.days;
      currentQuizIndex += 1;
      quizWrongInCurrent = 0;
      quizWrongClicked = [];
      quizAnsweredCorrectly = false;
      if (topic && currentQuizIndex >= topic.questions.length) {
        recordParentMilestone('english_quiz', topic.title, `${quizScore}/${topic.maxScore} Puan • İlk Denemede Doğru: ${quizTotalFirstTryCorrect}/${topic.questions.length} • Hata: ${quizTotalMistakes}`);
      }
      renderActiveQuiz();
    }

    /* ========================================================
       PWA, SAFARI & CHROME OTOMATİK GÜNCELLEME SİSTEMİ
       (Ana ekrana eklenen ikonların güncel sürümü otomatik alması için)
    ======================================================== */
    const CURRENT_APP_VERSION = '2.9.2';
    let swRegistration = null;
    let updateBannerDismissed = false;

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=' + CURRENT_APP_VERSION)
          .then((reg) => {
            swRegistration = reg;
            // İlk açılışta güncelleme kontrolü
            reg.update().catch(() => {});

            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] Yeni sürüm indirildi, kullanıcıya bildirim gösteriliyor.');
                  showUpdateBanner();
                }
              });
            });
          })
          .catch((err) => {
            console.warn('[SW Kayıt Hatası]:', err);
          });

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_ACTIVATED') {
            console.log('[SW] Yeni versiyon devrede:', event.data.version);
          }
        });

        let isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });
      }
    }

    async function checkVersionManifest(silent = true) {
      try {
        const res = await fetch('version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
        });
        if (res.ok) {
          const data = await res.json();
          const storedVersion = localStorage.getItem('lingo_installed_version');
          if (storedVersion && storedVersion !== data.version) {
            console.log('[Version] Yeni versiyon yayınlanmış:', data.version, '(Yerel:', storedVersion, ')');
            showUpdateBanner();
            return true;
          } else if (!storedVersion) {
            localStorage.setItem('lingo_installed_version', data.version || CURRENT_APP_VERSION);
          }
        }
      } catch (e) {
        // Çevrimdışı durumda hata yutulur
      }
      return false;
    }

    function showUpdateBanner() {
      if (updateBannerDismissed) return;
      const banner = document.getElementById('pwaUpdateBanner');
      if (banner) {
        banner.style.display = 'flex';
      }
    }

    function dismissUpdateBanner() {
      updateBannerDismissed = true;
      const banner = document.getElementById('pwaUpdateBanner');
      if (banner) banner.style.display = 'none';
    }

    async function applyImmediateUpdate() {
      showUpdateToast('⏳ Yeni sürüm yükleniyor, önbellek temizleniyor...');
      if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage({ action: 'skipWaiting' });
      }

      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        } catch (e) {}
      }

      localStorage.setItem('lingo_installed_version', CURRENT_APP_VERSION);

      setTimeout(() => {
        const cleanUrl = window.location.origin + window.location.pathname + '?v=' + Date.now();
        window.location.replace(cleanUrl);
      }, 500);
    }

    async function manualCheckForUpdates(showFeedback = false) {
      recordActivity();
      if (showFeedback) {
        showUpdateToast('🔍 Yeni sürüm denetleniyor...');
      }

      if (swRegistration) {
        try {
          await swRegistration.update();
        } catch (e) {}
      }

      const hasNew = await checkVersionManifest(false);
      if (hasNew) {
        applyImmediateUpdate();
      } else {
        if (showFeedback) {
          showUpdateToast('🔄 Önbellek tazeleniyor...');
          setTimeout(() => {
            applyImmediateUpdate();
          }, 400);
        }
      }
    }

    function showUpdateToast(msg) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid #06b6d4;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 13px;
        font-weight: 800;
        z-index: 100000;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: center;
      `;
      toast.innerHTML = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.4s ease';
        setTimeout(() => toast.remove(), 400);
      }, 2200);
    }

    // iOS Safari WebClip & Android PWA Odaklanma Dinleyicileri
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionManifest(true);
      }
    });

    window.addEventListener('pageshow', () => {
      if (swRegistration) swRegistration.update().catch(() => {});
      checkVersionManifest(true);
    });

    window.addEventListener('online', () => {
      if (swRegistration) swRegistration.update().catch(() => {});
      checkVersionManifest(true);
    });

    // 2 dakikada bir otomatik kontrol
    setInterval(() => {
      if (navigator.onLine) {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionManifest(true);
      }
    }, 2 * 60 * 1000);

    /* ========================================================
       ANA EKRANA EKLE (ADD TO HOME SCREEN) AKILLI YÖNETİCİSİ
       - Yeni cihaz veya tarayıcıda açıldığında kullanıcıyı karşılar
       - Android / Chrome için yerel native kurulum penceresini tetikler
       - iOS / Safari için 3 adımlı Türkçe görsel rehber sunar
       - Ana ekrandan zaten açılmışsa (standalone) kullanıcıyı rahatsız etmez
    ======================================================== */
    let deferredInstallPrompt = null;

    // Cihazın Standalone (Ana Ekrandan Uygulama Olarak Açılıp Açılmadığını) Kontrol Et
    function isRunningStandalone() {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        document.referrer.includes('android-app://')
      );
    }

    // iOS Cihazı Tespiti
    function isIosDevice() {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Chrome/Android Kurulum Olayını Yakala
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      updateInstallButtonsVisibility();
      console.log('[PWA] beforeinstallprompt olayı yakalandı.');
    });

    // Uygulama başarıyla kurulduğunda
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] Uygulama başarıyla ana ekrana kuruldu.');
      deferredInstallPrompt = null;
      dismissInstallModal(false);
      hideInstallButtons();
      showUpdateToast('🎉 Tebrikler! Lingo Ders Arkadaşım ana ekranınıza eklendi.');
    });

    function updateInstallButtonsVisibility() {
      if (isRunningStandalone()) {
        hideInstallButtons();
        return;

      const headerBtn = document.getElementById('installAppHeaderBtn');
      const footerBtn = document.getElementById('installAppFooterBtn');

    // Otomatik Karşılama Kontrolü (Yeni cihazda açıldığında 2.4 saniye sonra tetiklenir)
    function checkAutoInstallPrompt() {

        console.log('[PWA] Uygulama zaten ana ekrandan çalışıyor, kurulum uyarısı gizlendi.');
        hideInstallButtons();
        return;
      }

      updateInstallButtonsVisibility();

      // Kullanıcı daha önce "Daha Sonra" demiş mi ve üzerinden 24 saat geçmiş mi?
      const dismissedUntil = localStorage.getItem('lingo_install_dismissed_until');
      if (dismissedUntil && Date.now() < parseInt(dismissedUntil)) {
        return;
      }

      // Yeni cihazda veya tarayıcıda ilk kez açıldığında kullanıcıya sor

      document.body.appendChild(modal);
    }

    // Kullanıcı "Evet, Ekle" Butonuna Bastığında
    async function confirmInstallApp() {
      recordActivity();
      
      // 1. Android / Chrome / Edge için yerel tarayıcı kurulum penceresi varsa doğrudan aç
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          console.log('[PWA] Kurulum tercihi:', outcome);
          if (outcome === 'accepted') {
            deferredInstallPrompt = null;
            dismissInstallModal(false);
            hideInstallButtons();
            showUpdateToast('🎉 Harika! Uygulama ana ekranınıza ekleniyor...');
            return;
          }
        } catch (e) {
          console.warn('[PWA Prompt Hatası]', e);
        }
      }

      // 2. iOS Safari (Apple güvenlik gereği JS ile doğrudan ekleyemez, 3 adımlı görsel rehber sunar)
      if (isIosDevice()) {
        showIosInstallGuide();
        return;
      }

      // 3. Diğer tarayıcılar (Samsung Internet, mobil Chrome genel)
      showGeneralInstallGuide();
    }

    function showIosInstallGuide() {
      const modal = document.getElementById('pwaInstallModal');
      if (!modal) return;
      modal.innerHTML = `
        <div class="card" style="max-width:440px;width:92%;text-align:center;padding:24px 20px;border:2px solid #38bdf8;box-shadow:0 16px 40px rgba(0,0,0,0.85);background:#0f172a;animation:fadeIn 0.3s ease;">
          <div style="font-size:46px;margin-bottom:6px;">🍎📲</div>
          <h3 style="font-size:19px;color:#fff;font-weight:900;margin-bottom:6px;">iPhone / iPad Ana Ekrana Ekleme</h3>
          <p style="font-size:12px;color:#94a3b8;margin-bottom:16px;">
            Apple Safari'de aşağıdaki 3 basit adımı uygulayarak saniyeler içinde ekleyebilirsiniz:
          </p>
          <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;margin-bottom:18px;text-align:left;font-size:13px;color:#e2e8f0;line-height:1.6;">
            <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;">
              <span style="font-size:22px;">1️⃣</span>
              <div>Safari'nin en altındaki <strong>Paylaş</strong> simgesine (<strong style="color:#38bdf8;">📤</strong> veya <strong>⎋</strong>) dokunun.</div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;">
              <span style="font-size:22px;">2️⃣</span>
              <div>Menüyü aşağı kaydırıp <strong>"Ana Ekrana Ekle"</strong> (<strong style="color:#10b981;">➕</strong>) seçeneğine dokunun.</div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;">
              <span style="font-size:22px;">3️⃣</span>
              <div>Sağ üst köşedeki mavi <strong>"Ekle"</strong> butonuna basın. Artık tam bir uygulama gibi ana ekranınızda hazır!</div>
            </div>
          </div>
          <button onclick="dismissInstallModal(false)" class="action-btn" style="background:#10b981;color:#fff;width:100%;font-size:14px;padding:11px;font-weight:900;border-radius:12px;">
            Tamam, Anladım ✓
          </button>
        </div>
      `;
    }

    function showGeneralInstallGuide() {
      const modal = document.getElementById('pwaInstallModal');
      if (!modal) return;
      modal.innerHTML = `
        <div class="card" style="max-width:440px;width:92%;text-align:center;padding:24px 20px;border:2px solid #38bdf8;box-shadow:0 16px 40px rgba(0,0,0,0.85);background:#0f172a;animation:fadeIn 0.3s ease;">
          <div style="font-size:46px;margin-bottom:6px;">📲⭐</div>
          <h3 style="font-size:19px;color:#fff;font-weight:900;margin-bottom:6px;">Ana Ekrana Nasıl Eklenir?</h3>
          <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;margin-bottom:18px;text-align:left;font-size:13px;color:#e2e8f0;line-height:1.6;">
            <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;">
              <span style="font-size:20px;">1️⃣</span>
              <div>Tarayıcınızın sağ üstündeki <strong>üç nokta menüsüne (⋮)</strong> dokunun.</div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;">
              <span style="font-size:20px;">2️⃣</span>
              <div><strong>"Uygulamayı Yükle"</strong> veya <strong>"Ana Ekrana Ekle"</strong> seçeneğini seçin.</div>
            </div>
          </div>
          <button onclick="dismissInstallModal(false)" class="action-btn" style="background:#10b981;color:#fff;width:100%;font-size:14px;padding:11px;font-weight:900;border-radius:12px;">
            Tamam, Kapat ✓
          </button>
        </div>
      `;
    }

    function dismissInstallModal(snooze = false) {
      const modal = document.getElementById('pwaInstallModal');
      if (modal) modal.remove();
      if (snooze) {
        localStorage.setItem('lingo_install_dismissed_until', String(Date.now() + 24 * 60 * 60 * 1000));
      }
    }

    function triggerPwaInstallPrompt(forceOpen = false) {
      recordActivity();
      if (isRunningStandalone()) {
        showUpdateToast('✨ Uygulama zaten ana ekranınızdan açılmış durumda!');
        return;
      }
      showPwaInstallModal();
    }

    // Başlangıçta Çift Katmanlı Kalıcı Hafıza, Service Worker ve Ana Ekrana Ekle kontrolü
    initPersistentMemorySystem();
    registerServiceWorker();
    checkVersionManifest(true);
    checkAutoInstallPrompt();

    // Başlangıçta tüm ünitelerin göründüğü ana menüyü yükle
    switchMainTab('menu');
  </script>
</body>
</html>
