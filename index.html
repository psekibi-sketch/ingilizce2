<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lingo Ders Arkadaşım</title>
  <meta name="apple-mobile-web-app-title" content="Ders Arkadaşım">
  <meta name="application-name" content="Lingo Ders Arkadaşım">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    #copyCodeBtn,
    #downloadHtmlBtn,
    [id*="copyCode"],
    [id*="downloadHtml"],
    .copy-btn,
    .dl-btn {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: relative;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-area h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .title-area p {
      font-size: 11px;
      color: var(--muted);
    }

    .header-widgets {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-badge {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }

    .timer-badge.paused {
      color: var(--warning);
      border-color: var(--warning);
    }

    .sound-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .nav-scroll {
      max-width: 900px;
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      padding-bottom: 2px;
    }

    .nav-tab {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .reset-btn:hover { background: rgba(239, 68, 68, 0.25); }

    .page-nav-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .page-chip {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .page-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .word-tile {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .word-tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .word-tile .tile-icon { font-size: 28px; margin-bottom: 6px; }
    .word-tile .en-text { font-size: 14px; font-weight: 700; color: #fff; }
    .word-tile .tr-text { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .speaker-icon {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 12px;
      opacity: 0.6;
    }

    .order-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 12px;
      margin: 12px 0;
      align-items: center;
    }

    .word-chip {
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .word-chip.pool {
      background: #334155;
      color: #e2e8f0;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .quiz-question-box {
      margin: 16px 0;
    }

    .quiz-prompt {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .quiz-word {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background: #0f172a;
      border: 2px solid var(--border);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none;
    }

    .option-btn:focus,
    .option-btn:focus-visible {
      outline: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .option-btn:hover {
        border-color: var(--primary);
        background: #1e293b;
      }
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: #f87171 !important;
    }

    .feedback-banner {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .feedback-banner.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #34d399;
    }

    .feedback-banner.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #f87171;
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn.retry {
      background: var(--warning);
      color: #0f172a;
    }

    .flashcard-container {
      perspective: 1000px;
      max-width: 320px;
      margin: 20px auto;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 200px;
      background: #1e293b;
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s;
    }

    .flashcard:hover {
      border-color: var(--accent);
    }

    .sortable-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sort-controls {
      display: flex;
      gap: 6px;
    }

    .sort-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================================
       RHYTHMIC COUNTING (3'ER VE 4'ER RİTMİK SAYMA) STYLES
    ======================================================== */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      50% { transform: scale(1.04); box-shadow: 0 0 22px 6px rgba(245, 158, 11, 0.45); }
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .rhythm-hero-banner {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      border: 2px solid #f472b6;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
      position: relative;
      overflow: hidden;
    }

    .rhythm-mode-switch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .rhythm-mode-btn {
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .rhythm-mode-btn.active-2 {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #bae6fd;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-3 {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      border-color: #fda4af;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-4 {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border-color: #7dd3fc;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-5 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #fde68a;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* 2 ANA BAŞLIK SEÇİM BUTONLARI */
    .subject-pill-btn {
      padding: 9px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .subject-pill-btn.active-math {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      border-color: #f472b6;
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.35);
    }

    .subject-pill-btn.active-english {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .subject-pill-btn.active-all {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border-color: #34d399;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    .rhythm-stage-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .rhythm-stage-tab {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .rhythm-stage-tab.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: #f59e0b;
      color: #fde047;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
    }

    .rhythm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .rhythm-step-card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .rhythm-step-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .rhythm-step-card.speaking-now {
      border-color: #fde047 !important;
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.28), rgba(15, 23, 42, 0.95)) !important;
      animation: pulseGlow 1.1s infinite;
      z-index: 2;
    }

    .rhythm-step-card.counted-done {
      border-color: #10b981;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.18), rgba(15, 23, 42, 0.95));
    }

    .rhythm-number-big {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
      margin: 6px 0 4px;
      background: linear-gradient(135deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rhythm-step-card.speaking-now .rhythm-number-big {
      background: linear-gradient(135deg, #fde047, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rhythm-visual-cluster {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 8px;
      margin: 6px 0;
      font-size: 16px;
    }

    .rhythm-mult-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      margin-top: 4px;
    }

    .rhythm-bubble-choice {
      min-width: 92px;
      padding: 16px 20px;
      font-size: 26px;
      font-weight: 900;
      border-radius: 18px;
      border: 3px solid #38bdf8 !important;
      background: linear-gradient(135deg, #1e293b, #0f172a) !important;
      color: #fff !important;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      transition: transform 0.1s ease;
    }

    /* Asla tıklanmış/seçilmiş kalmasın, tüm seçenekler her zaman aynı varsayılan görünümde kalsın */
    .rhythm-bubble-choice:focus,
    .rhythm-bubble-choice:focus-visible,
    .rhythm-bubble-choice:focus-within,
    .rhythm-bubble-choice:active,
    .rhythm-bubble-choice:visited {
      outline: none !important;
      border: 3px solid #38bdf8 !important;
      background: linear-gradient(135deg, #1e293b, #0f172a) !important;
      color: #fff !important;
      transform: none !important;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25) !important;
    }

    /* Dokunmatik ekranlarda imleç veya seçili kalma olmasın, yalnızca fareli masaüstünde hafif gezinme */
    @media (hover: hover) and (pointer: fine) {
      .rhythm-bubble-choice:hover {
        border: 3px solid #38bdf8 !important;
        background: linear-gradient(135deg, #1e293b, #0f172a) !important;
        transform: translateY(-2px);
      }
    }

    .rhythm-choice-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.25s ease-out;
    }

    .rhythm-choice-modal {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 26px 20px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(245,158,11,0.3);
    }

    .score-badge-circle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #fde047;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(16, 185, 129, 0.2));
      margin: 10px auto;
      box-shadow: 0 0 25px rgba(253, 224, 71, 0.35);
    }

    @media (max-width: 600px) {
      .rhythm-stage-tabs {
        grid-template-columns: 1fr;
      }
      .rhythm-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header-widgets .sound-btn {
        padding: 5px 8px;
        font-size: 11px;
      }
    }

    /* ========================================================
       YENİ ÖZELLİK VE ANİMASYON STİLLERİ
    ======================================================== */
    .badge-unlock-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #fde047;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10000;
      animation: slideInDown 0.4s ease;
      transition: all 0.4s ease;
    }
    @keyframes slideInDown {
      from { transform: translateY(-40px); opacity: 0; }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChimeSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.15, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.3);
          });
        } else if (type === 'rocket') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.7);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
        }
      } catch (e) {}
    }

    ======================================================== */
    function copyFullHtmlCode() {
      recordActivity();
      const currentDocHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const copyBtn = document.getElementById('copyCodeBtn');

      function showSuccess() {
        if (copyBtn) {
          copyBtn.textContent = '✅ Kod Kopyalandı!';
          copyBtn.style.background = '#10b981';
          setTimeout(() => {
            copyBtn.textContent = '📋 Kodu Kopyala';
            copyBtn.style.background = '#2563eb';
          }, 3000);
        }
        alert('🎉 Tüm 6 ünite ve 20 sorulu sınavı içeren eksiksiz index.html kodu panonuza kopyalandı! İstediğiniz yere (Not Defteri / VS Code / GitHub) yapıştırabilirsiniz.');
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentDocHtml).then(showSuccess).catch(() => {
          fallbackCopyText(currentDocHtml, showSuccess);
        });
      } else {
        fallbackCopyText(currentDocHtml, showSuccess);
      }
    }

    function fallbackCopyText(text, callback) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        callback();
      } catch (err) {
        alert('Panoya kopyalanamadı. Lütfen "HTML İndir" butonunu kullanarak doğrudan dosyayı indirin.');
      }
      document.body.removeChild(ta);
    }

    function downloadHtmlFile() {
      recordActivity();
      const currentDocHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([currentDocHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const dlBtn = document.getElementById('downloadHtmlBtn');
      if (dlBtn) {
        dlBtn.textContent = '✅ İndirildi!';
        setTimeout(() => { dlBtn.textContent = '⬇️ HTML İndir'; }, 2500);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function speakText(text) {
      recordActivity();
      if (!soundEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    function speakTurkish(text, rate = 0.92, onEndCallback = null) {
      recordActivity();
      if (!soundEnabled || !window.speechSynthesis) {
        if (onEndCallback) setTimeout(onEndCallback, 900);
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR';
      u.rate = rate;
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const trVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
      if (trVoice) u.voice = trVoice;
      let finished = false;
      const done = () => {
        if (!finished) {
          finished = true;
          if (onEndCallback) onEndCallback();
        }
      };
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
    }

    function startRhythmAutoTeach() {
      recordActivity();

      renderRhythmicCounting();

      const info = rhythmData[rhythmActiveMode];
      let introText = "";
      if (rhythmCountDirection === 'backward') {
        const modeSay = (rhythmActiveMode === 2) ? "2'şer 2'şer" :
                         (rhythmActiveMode === 3) ? "3'er 3'er" :
                         (rhythmActiveMode === 4) ? "4'er 4'er" : "5'er 5'er";
        introText = `Roket Modu! Haydi ${info.maxNumber}'den geriye doğru ${modeSay} sayalım ve roketi fırlatalım!`;
      } else {
        const introMap = {
          2: "Haydi 2'şer 2'şer 20'ye kadar beraber sayalım ve öğrenelim!",
          3: "Haydi 3'er 3'er 30'a kadar beraber sayalım ve öğrenelim!",
          4: "Haydi 4'er 4'er 40'a kadar beraber sayalım ve öğrenelim!",
          5: "Haydi 5'er 5'er 50'ye kadar beraber sayalım ve öğrenelim!"
        };
        introText = introMap[rhythmActiveMode] || `Haydi ${rhythmActiveMode}'er ${info.maxNumber}'ye kadar beraber sayalım ve öğrenelim!`;
      }

      speakTurkish(introText, 0.95, () => {
        if (!rhythmAutoPlaying) return;
        playNextRhythmTeachStep(1);
      });
    }

    function playNextRhythmTeachStep(stepIndex) {
      if (!rhythmAutoPlaying || currentMainTab !== 'rhythmic' || rhythmActiveStage !== 'learn') return;
      const info = rhythmData[rhythmActiveMode];
      if (stepIndex > info.steps.length) {
        rhythmAutoPlaying = false;
        rhythmCurrentHighlightStep = 0;
        rhythmTeachCompletedOnce = true;
        rhythmTeachChoiceDialog = true; // Sayma bitti uyarısı / modalı
        renderRhythmicCounting();
        speakTurkish("Harika dinledin! Sayma tamamlandı. Tekrar sayayım mı, yoksa sonraki aşamaya geçelim mi?", 0.95);
        return;
      }

      rhythmCurrentHighlightStep = stepIndex;
      renderRhythmicCounting();

      // Aktif kartı ekranda görünür tut
      const activeEl = document.getElementById(`rhythm_card_${stepIndex}`);
      if (activeEl && activeEl.scrollIntoView) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const item = info.steps[stepIndex - 1];
      const speech = rhythmTeachSpeechStyle === 'mult' ? item.speakTeach : item.tr;

      speakTurkish(speech, 0.9, () => {
        if (!rhythmAutoPlaying) return;
        rhythmAutoTimer = setTimeout(() => {
          playNextRhythmTeachStep(stepIndex + 1);
        }, 420);
      });
    }

    // 2. AŞAMA: SIRA SENDE (ÇOCUĞUN SAYMASI & SÜRE/PARMAK HESABI ANALİZİ)
    function initRhythmPractice() {
      rhythmPracticeTargetStep = 1;
      rhythmPracticeWrongFeedback = '';
      rhythmPracticeCompleted = false;
      rhythmPracticeStartTime = Date.now();
      rhythmPracticeEndTime = null;
      rhythmPracticeDuration = 0;
      rhythmPracticeTotalMistakes = 0;
      rhythmCurrentStepAttempts = 1;
      rhythmPracticeStepStats = [];
      generateRhythmPracticeChoices();
      renderRhythmicCounting();
      const info = rhythmData[rhythmActiveMode];
      const modeSay = (rhythmActiveMode === 2) ? "2'şer 2'şer" :
                      (rhythmActiveMode === 3) ? "3'er 3'er" :
                      (rhythmActiveMode === 4) ? "4'er 4'er" : "5'er 5'er";
      speakTurkish(`Şimdi sıra sende! ${modeSay} ${info.maxNumber}'e kadar sen sayıyorsun! İlk sayımız kaç? Yüksek sesle söyle ve seç!`, 0.95);
    }

    function generateRhythmPracticeChoices() {
      const info = rhythmData[rhythmActiveMode];
      if (rhythmPracticeTargetStep > info.steps.length) {
        rhythmPracticeChoices = [];
        return;
      }
      const correctNum = info.steps[rhythmPracticeTargetStep - 1].num;
      const distractors = new Set();
      const candidates = [
        correctNum + 1,
        correctNum - 1,
        correctNum + 2,
        correctNum + info.stepSize,
        Math.max(1, correctNum - info.stepSize),
        correctNum + 3
      ].filter(n => n > 0 && n !== correctNum && n <= info.maxNumber + 6);

      while (distractors.size < 3 && candidates.length > 0) {
        const pick = candidates.splice(Math.floor(Math.random() * candidates.length), 1)[0];
        distractors.add(pick);
      }
      rhythmPracticeChoices = [correctNum, ...Array.from(distractors)].sort((a, b) => a - b);
    }

    function handleChildCountChoice(chosenNum, btnElem) {
      recordActivity();
      if (btnElem && typeof btnElem.blur === 'function') btnElem.blur();
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
      if (window.getSelection) {
        try { window.getSelection().removeAllRanges(); } catch (e) {}
      }
      const info = rhythmData[rhythmActiveMode];
      const currentItem = info.steps[rhythmPracticeTargetStep - 1];
      if (!currentItem) return;

      if (chosenNum === currentItem.num) {
        // Doğru seçim: Bu adımın kaçıncı denemede doğru bilindiğini kaydet
        rhythmPracticeStepStats.push({
          step: currentItem.step,
          num: currentItem.num,
          tr: currentItem.tr,
          attempts: rhythmCurrentStepAttempts,
          mistakes: rhythmCurrentStepAttempts - 1
        });
        rhythmCurrentStepAttempts = 1;
        rhythmPracticeWrongFeedback = '';

        if (rhythmPracticeTargetStep >= info.steps.length) {
          // TÜM SAYILAR AÇILDI! BAŞARI VE SÜRE HESAPLAMA
          rhythmPracticeEndTime = Date.now();
          rhythmPracticeDuration = Math.max(1, Math.round((rhythmPracticeEndTime - rhythmPracticeStartTime) / 1000));
          rhythmPracticeCompleted = true;
          renderRhythmicCounting();
          const stats = calculateRhythmPracticeScore(rhythmPracticeDuration, rhythmPracticeTotalMistakes);
          speakTurkish(`${currentItem.tr}! Harikasın şampiyon, tamamladın! Süren ${rhythmPracticeDuration} saniye, puanın 100 üzerinden ${stats.totalScore}! ${stats.voiceFeedback}`, 0.94);
        } else {
          rhythmPracticeTargetStep++;
          generateRhythmPracticeChoices();
          renderRhythmicCounting();
          speakTurkish(`Aferin, ${currentItem.tr}! Sıradaki sayı kaç?`, 0.95);
        }
      } else {
        rhythmPracticeTotalMistakes++;
        rhythmCurrentStepAttempts++;
        rhythmPracticeWrongFeedback = `❌ ${chosenNum} değil! İpucu: ${rhythmPracticeTargetStep} tane ${info.stepSize} (${rhythmPracticeTargetStep} × ${info.stepSize}) kaç eder?`;
        renderRhythmicCounting();
        speakTurkish(`Tekrar dene! ${rhythmPracticeTargetStep} tane ${info.stepSize} kaç eder?`, 0.95);
      }
    }

    // PEDAGOJİK PARMAK HESABI VE HIZ ANALİZ MOTORU
    function calculateRhythmPracticeScore(durationSec, totalMistakes) {
      if (rhythmCountDirection === 'backward') {
        unlockBadge('rocket_pilot');
        playChimeSound('rocket');
      } else {
        unlockBadge('rhythm_' + rhythmActiveMode);
        playChimeSound('correct');
      }
      // 10 basamak için ezbere süre: 18 - 25 saniye (basamak başı ~2 saniye)
      // Parmakla sayıyorsa basamak başı 5-8 saniye (toplam > 50-60 saniye) sürer.
      let speedScore = 50;
      let fingerCountingStatus = '';
      let fingerCountingIcon = '⚡';
      let fingerCountingColor = '#10b981';
      let voiceFeedback = '';
      let pedagojikNot = '';

      if (durationSec <= 22) {
        speedScore = 50;
        fingerCountingStatus = 'YILDIRIM EZBER (Parmak Hesabı YOK!)';
        fingerCountingIcon = '⚡';
        fingerCountingColor = '#10b981';
        voiceFeedback = 'Harika! Parmak hesabı yapmadan şarkı gibi ezbere bildin!';
        pedagojikNot = 'Mükemmel akıcılık! Sayılar hafızaya tam yerleşmiş, parmak hesabı yapmadan yıldırım gibi bitirdin.';
      } else if (durationSec <= 32) {
        speedScore = 44;
        fingerCountingStatus = 'ÇOK HIZLI (Parmak Hesabı Yok)';
        fingerCountingIcon = '👏';
        fingerCountingColor = '#38bdf8';
        voiceFeedback = 'Çok hızlısın! Parmak hesabı yapmadan gayet akıcı tamamladın.';
        pedagojikNot = 'Çok iyi! Neredeyse hiç duraksamadan, ritmi bozmadan akıcı bir şekilde tamamlandı.';
      } else if (durationSec <= 48) {
        speedScore = 30;
        fingerCountingStatus = 'ORTA HIZ (Hafif Parmak Hesabı Şüphesi)';
        fingerCountingIcon = '✋';
        fingerCountingColor = '#f59e0b';
        voiceFeedback = 'Bitirdin ama bazı sayılarda parmakla saydın gibi! Pratikle hızlanacaksın.';
        pedagojikNot = 'Ortalama basamak süresi 3-4 saniyeyi bulduğu için bazı adımlarda parmak hesabı yapılmış olabilir. Birkaç tekrarla tamamen ezbere geçilebilir.';
      } else if (durationSec <= 65) {
        speedScore = 18;
        fingerCountingStatus = 'YAVAŞ (Parmak Hesabı Yapılıyor)';
        fingerCountingIcon = '🐢';
        fingerCountingColor = '#f97316';
        voiceFeedback = 'Parmakla tek tek saydığın için süre uzadı. Hedefimiz parmaksız ezber!';
        pedagojikNot = 'Basamak başı 5-6 saniye sürüyor; çocuk sayıları zihinden ekleyerek veya parmakla sayarak buluyor. Hedefimiz ritmi şarkı gibi parmaksız ezberletmek.';
      } else {
        speedScore = 8;
        fingerCountingStatus = 'YOĞUN PARMAK HESABI TESPİT EDİLDİ';
        fingerCountingIcon = '🖐️';
        fingerCountingColor = '#ef4444';
        voiceFeedback = 'Parmak hesabı tespit edildi! Haydi testi başa alıp tekrar deneyelim!';
        pedagojikNot = 'Süre 65 saniyenin üzerinde; sayıları ezberden değil parmakla tek tek sayarak buluyor. 1. Aşamayı bir kez daha dinleyip testi baştan alması çok faydalı olacaktır.';
      }

      // Hata puanı: 50 puan üzerinden, her hata -6 puan
      const mistakePenalty = totalMistakes * 6;
      const accuracyScore = Math.max(0, 50 - mistakePenalty);
      const totalScore = Math.max(10, Math.min(100, speedScore + accuracyScore));

      return {
        speedScore,
        accuracyScore,
        totalScore,
        fingerCountingStatus,
        fingerCountingIcon,
        fingerCountingColor,
        voiceFeedback,
        pedagojikNot,
        idealDuration: 20
      };
    }

    function startChildVoiceCount() {
      recordActivity();
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const info = rhythmData[rhythmActiveMode];
      const currentItem = info.steps[rhythmPracticeTargetStep - 1];
      if (!currentItem) return;

      if (!SpeechRec) {
        speakTurkish(`Yüksek sesle ${currentItem.tr} dedin, harikasın!`, 0.95);
        handleChildCountChoice(currentItem.num);
        return;
      }

      try {
        const rec = new SpeechRec();
        rec.lang = 'tr-TR';
        rec.interimResults = false;
        rec.maxAlternatives = 4;
        rhythmVoiceListening = true;
        renderRhythmicCounting();

        rec.onresult = (event) => {
          rhythmVoiceListening = false;
          let transcripts = [];
          for (let i = 0; i < event.results[0].length; i++) {
            transcripts.push(event.results[0][i].transcript.toLowerCase().trim());
          }
          const combined = transcripts.join(' ');
          const targetNumStr = String(currentItem.num);
          const targetTrStr = currentItem.tr.toLowerCase();

          if (combined.includes(targetNumStr) || combined.includes(targetTrStr)) {
            handleChildCountChoice(currentItem.num);
          } else {
            rhythmPracticeWrongFeedback = `🎙️ "${transcripts[0] || ''}" duyuldu. Yüksek sesle "${currentItem.tr} (${currentItem.num})" söyle veya aşağıdaki ${currentItem.num} baloncuğuna dokun!`;
            renderRhythmicCounting();
          }
        };
        rec.onerror = () => {
          rhythmVoiceListening = false;
          renderRhythmicCounting();
        };
        rec.onend = () => {
          rhythmVoiceListening = false;
          renderRhythmicCounting();
        };
        rec.start();
      } catch (e) {
        rhythmVoiceListening = false;
        handleChildCountChoice(currentItem.num);
      }
    }

    function initRhythmExam(filterMode = 'both') {
      rhythmExamFilter = filterMode;
      rhythmExamQuestions = buildRhythmQuestionsForMode(filterMode);
      rhythmExamIndex = 0;
      rhythmExamScore = 0;
      rhythmExamStreak = 0;
      rhythmExamBestStreak = 0;
      rhythmExamFirstTry = 0;
      rhythmExamWrongCurrent = 0;
      rhythmExamWrongClicked = [];
      rhythmExamAnswered = false;
      renderRhythmicCounting();
      if (rhythmExamQuestions[0]) {
        speakTurkish(rhythmExamQuestions[0].speakPrompt, 0.94);
      }
    }

    function answerRhythmExamOption(selectedOption) {
      recordActivity();
      if (rhythmExamAnswered) return;
      const q = rhythmExamQuestions[rhythmExamIndex];
      if (!q) return;

      if (selectedOption === q.correct) {
        rhythmExamAnswered = true;
        if (rhythmExamWrongCurrent === 0) {
          rhythmExamScore += 10;
          rhythmExamFirstTry++;
          rhythmExamStreak++;
          if (rhythmExamStreak > rhythmExamBestStreak) rhythmExamBestStreak = rhythmExamStreak;
        } else {
          rhythmExamScore += 5;
        }
        renderRhythmicCounting();
        speakTurkish(`Harika! Doğru cevap ${q.correct.split(' ')[0]}!`, 0.95);
      } else {
        if (!rhythmExamWrongClicked.includes(selectedOption)) {
          rhythmExamWrongClicked.push(selectedOption);
        }
        rhythmExamWrongCurrent++;
        rhythmExamStreak = 0;
        renderRhythmicCounting();
        speakTurkish("Tekrar dikkatlice sayalım!", 0.95);
      }
    }

    function nextRhythmExamQuestion() {
      recordActivity();
      rhythmExamIndex++;
      rhythmExamWrongCurrent = 0;
      rhythmExamWrongClicked = [];
      rhythmExamAnswered = false;
      renderRhythmicCounting();
      const q = rhythmExamQuestions[rhythmExamIndex];
      if (q) {
        speakTurkish(q.speakPrompt, 0.94);
      } else {
        speakTurkish(`Tebrikler! Ritmik sayma sınavını ${rhythmExamScore} puanla tamamladın!`, 0.94);
      }
    }

    function moveDayUp(idx) {
      if (idx <= 0) return;
      const tmp = userDaysOrder[idx];
      userDaysOrder[idx] = userDaysOrder[idx - 1];
      userDaysOrder[idx - 1] = tmp;
      renderDaysSort();
    }

    function moveDayDown(idx) {
      if (idx >= userDaysOrder.length - 1) return;
      const tmp = userDaysOrder[idx];
      userDaysOrder[idx] = userDaysOrder[idx + 1];
      userDaysOrder[idx + 1] = tmp;
      renderDaysSort();

    }

            <div style="background:#0f172a;border:2px solid #10b981;border-radius:16px;padding:22px;margin-bottom:18px;text-align:center;">

            <!-- ŞIKLAR (SEÇENEKLER) -->
            <div class="quiz-options" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">

                const isRight = quizAnsweredCorrectly && opt === q.correct;

    // SESLİ TELAFFUZ DEĞERLENDİRME VE MİKROFON FONKSİYONLARI
    function startChildVoiceRecognition(targetWord) {
      const micBtn = document.getElementById('quizMicBtn');
      const statusDiv = document.getElementById('quizSpeechStatus');
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (statusDiv) {
          statusDiv.innerHTML = `
            <div style="background:rgba(234,88,12,0.15);border:1px solid #f97316;color:#fdba74;padding:10px;border-radius:10px;font-size:12px;">
              🎙️ Tarayıcınızda otomatik mikrofon tanıma desteklenmiyor veya izin gerekli.
              <br><strong>Harika çalıştın!</strong> Kelimeyi sesli söylediysen aşağıdaki butona basıp puanını al:
            </div>`;
        }
        return;
      }

      try {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 3;

        if (micBtn) {
          micBtn.style.background = '#ef4444';
          micBtn.innerHTML = '🔴 Seni Dinliyorum... Şimdi Söyle!';
        }
        if (statusDiv) {
          statusDiv.innerHTML = `<span style="color:#fde047;font-weight:700;">🎙️ Konuşabilirsiniz: "${targetWord}" deyin...</span>`;
        }

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript.trim().toLowerCase();
          const targetClean = targetWord.trim().toLowerCase();
          console.log('Spoken:', transcript, 'Target:', targetClean);

          const isMatch = transcript.includes(targetClean) || 
                          targetClean.includes(transcript) || 
                          transcript.split(' ').some(w => targetClean.includes(w));

          if (isMatch) {
            handleChildPronunciationSuccess(transcript, targetWord);
          } else {
            if (statusDiv) {
              statusDiv.innerHTML = `
                <div style="background:rgba(248,113,113,0.15);border:1px solid #f87171;color:#f87171;padding:10px;border-radius:10px;font-size:12px;">
                  🤔 "${transcript}" duyuldu. Yaklaştın! Bir kez daha dene veya doğru söylediysen onayla:
                  <div style="display:flex;gap:8px;margin-top:8px;justify-content:center;">
                    <button class="action-btn" style="background:#2563eb;padding:6px 12px;font-size:11px;" onclick="startChildVoiceRecognition('${targetWord}')">
                      🔄 Tekrar Söyle
                    </button>
                    <button class="action-btn" style="background:#10b981;padding:6px 12px;font-size:11px;" onclick="confirmChildSpokeCorrectly('${targetWord}')">
                      👍 Doğru Söyledim (+10 Puan)
                    </button>
                  </div>
                </div>`;
            }
            if (micBtn) {
              micBtn.style.background = '#10b981';
              micBtn.innerHTML = '🎙️ Mikrofona Bas ve Tekrar Söyle';
            }
          }
        };

        recognition.onerror = function(event) {
          console.warn('Speech recognition error:', event.error);
          if (statusDiv) {
            statusDiv.innerHTML = `
              <div style="background:rgba(234,88,12,0.15);border:1px solid #f97316;color:#fdba74;padding:8px;border-radius:10px;font-size:12px;">
                🎙️ Kelimeyi yüksek sesle söylediysen butona basarak puanını alabilirsin!
              </div>`;
          }
          if (micBtn) {
            micBtn.style.background = '#10b981';
            micBtn.innerHTML = '🎙️ Mikrofona Bas ve Söyle!';
          }
        };

        recognition.onend = function() {
          if (micBtn && micBtn.innerHTML.includes('Seni Dinliyorum')) {
            micBtn.style.background = '#10b981';
            micBtn.innerHTML = '🎙️ Mikrofona Bas ve Söyle!';
          }
        };

        recognition.start();
      } catch(e) {
        console.error('Speech recognition start failed:', e);
      }
    }

    function handleChildPronunciationSuccess(transcript, targetWord) {
      if (quizAnsweredCorrectly) return;
      quizAnsweredCorrectly = true;
      speakText('Excellent pronunciation! Well done!');
      quizScore += 10;
      quizStreak += 1;
      if (quizStreak > quizBestStreak) quizBestStreak = quizStreak;
      quizTotalFirstTryCorrect += 1;

      const statusDiv = document.getElementById('quizSpeechStatus');
      if (statusDiv) {
        statusDiv.innerHTML = `
          <div style="background:rgba(52,211,153,0.2);border:2px solid #34d399;color:#34d399;padding:12px;border-radius:10px;font-size:14px;font-weight:800;">
            🎉 HARİKA TELAFFUZ! "${targetWord}" kelimesini çok güzel söyledin! ⭐ +10 Puan
          </div>`;
      }
      renderActiveQuiz();
      setTimeout(() => {
        if (quizAnsweredCorrectly) advanceQuizQuestion();
      }, 1500);
    }

    function confirmChildSpokeCorrectly(targetWord) {
      if (quizAnsweredCorrectly) return;
      quizAnsweredCorrectly = true;
      speakText('Great job! ' + targetWord);
      quizScore += 10;
      quizStreak += 1;
      if (quizStreak > quizBestStreak) quizBestStreak = quizStreak;
      quizTotalFirstTryCorrect += 1;
      renderActiveQuiz();
      setTimeout(() => {
        if (quizAnsweredCorrectly) advanceQuizQuestion();
      }, 1400);
    }

    // CEVAP KONTROLÜ
    function handleQuizAnswer(selectedOption) {
      if (quizAnsweredCorrectly) return;
      const topic = quizTopicBanks[activeTopicId] || quizTopicBanks.days;
      const q = topic.questions[currentQuizIndex];

      if (selectedOption === q.correct) {
        // DOĞRU CEVAP!
        quizAnsweredCorrectly = true;
        speakText('Correct! ' + q.correct);
        if (quizWrongInCurrent === 0) {
          quizScore += 10;
          quizStreak += 1;
          if (quizStreak > quizBestStreak) quizBestStreak = quizStreak;
          quizTotalFirstTryCorrect += 1;
        } else {
          quizScore += 5;
          quizStreak = 0;
        }
        renderActiveQuiz();
        setTimeout(() => {
          if (quizAnsweredCorrectly) {
            advanceQuizQuestion();
          }
        }, 1400);
      } else {
        // YANLIŞ CEVAP!
        speakText('Try again');
        quizWrongInCurrent += 1;
        quizTotalMistakes += 1;
        quizStreak = 0;
        if (!quizWrongClicked.includes(selectedOption)) {
          quizWrongClicked.push(selectedOption);
        }
        renderActiveQuiz();
      }
    }

    function advanceQuizQuestion() {
      currentQuizIndex += 1;
      quizWrongInCurrent = 0;
      quizWrongClicked = [];
      quizAnsweredCorrectly = false;
      renderActiveQuiz();
    }

    function renderQuiz() {
      renderQuizHub();
    }

    function nextQuizQuestion() {
      if (currentQuizIndex < (quizTopicBanks[activeTopicId]?.questions?.length || 10)) {
        currentQuizIndex++;
        quizWrongInCurrent = 0;
        quizWrongClicked = [];
        quizAnsweredCorrectly = false;
        renderActiveQuiz();
      }
    }

    /* ========================================================
       8. FLASHCARDS (FLAŞ KARTLAR)
    ======================================================== */
    const allFlashcards = [
      ...u5RoomsAndFurniture,
      ...u4FamilyMembers,
      ...u3BodyParts,
      ...u3Clothes,
      ...u2Objects,
      ...correctDaysOrder
    ];

    let flashcardIndex = 0;
    let flashcardFlipped = false;

    function renderFlashcards() {
      const card = allFlashcards[flashcardIndex];

      const html = `
        <div class="card" style="text-align:center;">
          <div class="card-header-bar">
            <div class="card-title">🃏 Kelime Kartları (${flashcardIndex + 1} / ${allFlashcards.length})</div>
            <button class="reset-btn" onclick="flashcardIndex=0;flashcardFlipped=false;renderFlashcards();">🔄 Başa Dön</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Karta tıklayarak Türkçesini görün veya arkasını çevirin.</p>

          <div class="flashcard-container" onclick="flipFlashcard()">
            <div class="flashcard">
              <div style="font-size:48px;margin-bottom:8px;">${card.icon || '📖'}</div>
              <h2 style="font-size:24px;color:#38bdf8;">${flashcardFlipped ? card.tr : card.en}</h2>
              <p style="font-size:12px;color:var(--muted);margin-top:6px;">
                ${flashcardFlipped ? 'İngilizcesi: ' + card.en : 'Dokununca Türkçesini gösterir'}
              </p>
            </div>
          </div>

          <div style="display:flex;justify-content:center;gap:12px;margin-top:14px;">
            <button class="sort-btn" style="width:44px;height:44px;" onclick="prevFlashcard()">◀</button>
            <button class="action-btn" onclick="speakText('${card.en}')">🔊 Seslendir</button>
            <button class="sort-btn" style="width:44px;height:44px;" onclick="nextFlashcard()">▶</button>
          </div>
        </div>
      `;

      document.getElementById('appContent').innerHTML = html;
    }

    function flipFlashcard() {
      flashcardFlipped = !flashcardFlipped;
      renderFlashcards();
    }

    function nextFlashcard() {
      flashcardIndex = (flashcardIndex + 1) % allFlashcards.length;
      flashcardFlipped = false;
      renderFlashcards();
    }

    function prevFlashcard() {
      flashcardIndex = (flashcardIndex - 1 + allFlashcards.length) % allFlashcards.length;
      flashcardFlipped = false;
      renderFlashcards();
    }

    /* ========================================================
       9. DAYS GUIDE (GÜNLER REHBERİ)
    ======================================================== */
    function renderDaysGuide() {
      const html = `
        <div class="card">
          <div class="card-header-bar">
            <div class="card-title">📖 Haftanın Günleri Telaffuz & Bilgi Rehberi</div>
            <button class="reset-btn" onclick="renderDaysGuide()">🔄 Yenile</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Her güne tıklayarak doğru telaffuzunu dinleyebilirsiniz.</p>
          <div class="word-grid">
            ${correctDaysOrder.map((d, idx) => `
              <div class="word-tile" onclick="speakText('${d.en}')">
                <span class="speaker-icon">🔊</span>
                <div class="tile-icon">📅</div>
                <div class="en-text">${idx + 1}. ${d.en}</div>
                <div class="tr-text">${d.tr}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('appContent').innerHTML = html;
    }

    /* ========================================================
       PWA, SAFARI & CHROME OTOMATİK GÜNCELLEME SİSTEMİ
       (Ana ekrana eklenen ikonların güncel sürümü otomatik alması için)
    ======================================================== */
    const CURRENT_APP_VERSION = '2.6.1';
    let swRegistration = null;
    let updateBannerDismissed = false;

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=' + CURRENT_APP_VERSION)
          .then((reg) => {
            swRegistration = reg;
            // İlk açılışta güncelleme kontrolü
            reg.update().catch(() => {});

            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] Yeni sürüm indirildi, kullanıcıya bildirim gösteriliyor.');
                  showUpdateBanner();
                }
              });
            });
          })
          .catch((err) => {
            console.warn('[SW Kayıt Hatası]:', err);
          });

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_ACTIVATED') {
            console.log('[SW] Yeni versiyon devrede:', event.data.version);
          }
        });

        let isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });
      }
    }

    async function checkVersionManifest(silent = true) {
      try {
        const res = await fetch('version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
        });
        if (res.ok) {
          const data = await res.json();
          const storedVersion = localStorage.getItem('lingo_installed_version');
          if (storedVersion && storedVersion !== data.version) {
            console.log('[Version] Yeni versiyon yayınlanmış:', data.version, '(Yerel:', storedVersion, ')');
            showUpdateBanner();
            return true;
          } else if (!storedVersion) {
            localStorage.setItem('lingo_installed_version', data.version || CURRENT_APP_VERSION);
          }
        }
      } catch (e) {
        // Çevrimdışı durumda hata yutulur
      }
      return false;
    }

    function showUpdateBanner() {
      if (updateBannerDismissed) return;
      const banner = document.getElementById('pwaUpdateBanner');
      if (banner) {
        banner.style.display = 'flex';
      }
    }

    function dismissUpdateBanner() {
      updateBannerDismissed = true;
      const banner = document.getElementById('pwaUpdateBanner');
      if (banner) banner.style.display = 'none';
    }

    async function applyImmediateUpdate() {
      showUpdateToast('⏳ Yeni sürüm yükleniyor, önbellek temizleniyor...');
      if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage({ action: 'skipWaiting' });
      }

      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        } catch (e) {}
      }

      localStorage.setItem('lingo_installed_version', CURRENT_APP_VERSION);

      setTimeout(() => {
        const cleanUrl = window.location.origin + window.location.pathname + '?v=' + Date.now();
        window.location.replace(cleanUrl);
      }, 500);
    }

    async function manualCheckForUpdates(showFeedback = false) {
      recordActivity();
      if (showFeedback) {
        showUpdateToast('🔍 Yeni sürüm denetleniyor...');
      }

      if (swRegistration) {
        try {
          await swRegistration.update();
        } catch (e) {}
      }

      const hasNew = await checkVersionManifest(false);
      if (hasNew) {
        applyImmediateUpdate();
      } else {
        if (showFeedback) {
          showUpdateToast('🔄 Önbellek tazeleniyor...');
          setTimeout(() => {
            applyImmediateUpdate();
          }, 400);
        }
      }
    }

    function showUpdateToast(msg) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid #06b6d4;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 13px;
        font-weight: 800;
        z-index: 100000;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: center;
      `;
      toast.innerHTML = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.4s ease';
        setTimeout(() => toast.remove(), 400);
      }, 2200);
    }

    // iOS Safari WebClip & Android PWA Odaklanma Dinleyicileri
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionManifest(true);
      }
    });

    window.addEventListener('pageshow', () => {
      if (swRegistration) swRegistration.update().catch(() => {});
      checkVersionManifest(true);
    });

    window.addEventListener('online', () => {
      if (swRegistration) swRegistration.update().catch(() => {});
      checkVersionManifest(true);
    });

    // 2 dakikada bir otomatik kontrol
    setInterval(() => {
      if (navigator.onLine) {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionManifest(true);
      }
    }, 2 * 60 * 1000);

    // Başlangıçta kayıt ve denetim
    registerServiceWorker();
    checkVersionManifest(true);

    // Başlangıçta tüm ünitelerin göründüğü ana menüyü yükle
    switchMainTab('menu');
  </script>
</body>
</html>
