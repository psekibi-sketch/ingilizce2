<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lingo Ders Arkadaşım</title>
  <meta name="apple-mobile-web-app-title" content="Ders Arkadaşım">
  <meta name="application-name" content="Lingo Ders Arkadaşım">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    #copyCodeBtn,
    #downloadHtmlBtn,
    [id*="copyCode"],
    [id*="downloadHtml"],
    .copy-btn,
    .dl-btn {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: relative;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-area h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .title-area p {
      font-size: 11px;
      color: var(--muted);
    }

    .header-widgets {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-badge {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }

    .timer-badge.paused {
      color: var(--warning);
      border-color: var(--warning);
    }

    .sound-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .nav-scroll {
      max-width: 900px;
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      padding-bottom: 2px;
    }

    .nav-tab {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .reset-btn:hover { background: rgba(239, 68, 68, 0.25); }

    .page-nav-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .page-chip {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .page-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .word-tile {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .word-tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .word-tile .tile-icon { font-size: 28px; margin-bottom: 6px; }
    .word-tile .en-text { font-size: 14px; font-weight: 700; color: #fff; }
    .word-tile .tr-text { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .speaker-icon {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 12px;
      opacity: 0.6;
    }

    .order-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 12px;
      margin: 12px 0;
      align-items: center;
    }

    .word-chip {
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .word-chip.pool {
      background: #334155;
      color: #e2e8f0;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .quiz-question-box {
      margin: 16px 0;
    }

    .quiz-prompt {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .quiz-word {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background: #0f172a;
      border: 2px solid var(--border);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none;
    }

    .option-btn:focus,
    .option-btn:focus-visible {
      outline: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .option-btn:hover {
        border-color: var(--primary);
        background: #1e293b;
      }
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: #f87171 !important;
    }

    .feedback-banner {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .feedback-banner.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #34d399;
    }

    .feedback-banner.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #f87171;
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn.retry {
      background: var(--warning);
      color: #0f172a;
    }

    .flashcard-container {
      perspective: 1000px;
      max-width: 320px;
      margin: 20px auto;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 200px;
      background: #1e293b;
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s;
    }

    .flashcard:hover {
      border-color: var(--accent);
    }

    .sortable-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sort-controls {
      display: flex;
      gap: 6px;
    }

    .sort-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================================
       RHYTHMIC COUNTING (3'ER VE 4'ER RİTMİK SAYMA) STYLES
    ======================================================== */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      50% { transform: scale(1.04); box-shadow: 0 0 22px 6px rgba(245, 158, 11, 0.45); }
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .rhythm-hero-banner {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      border: 2px solid #f472b6;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
      position: relative;
      overflow: hidden;
    }

    .rhythm-mode-switch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .rhythm-mode-btn {
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .rhythm-mode-btn.active-2 {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #bae6fd;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-3 {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      border-color: #fda4af;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-4 {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border-color: #7dd3fc;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
      transform: translateY(-2px);
    }

    .rhythm-mode-btn.active-5 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #fde68a;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* 2 ANA BAŞLIK SEÇİM BUTONLARI */
    .subject-pill-btn {
      padding: 9px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .subject-pill-btn.active-math {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      border-color: #f472b6;
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.35);
    }

    .subject-pill-btn.active-english {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .subject-pill-btn.active-all {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border-color: #34d399;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    .rhythm-stage-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .rhythm-stage-tab {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .rhythm-stage-tab.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: #f59e0b;
      color: #fde047;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
    }

    .rhythm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .rhythm-step-card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .rhythm-step-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .rhythm-step-card.speaking-now {
      border-color: #fde047 !important;
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.28), rgba(15, 23, 42, 0.95)) !important;
      animation: pulseGlow 1.1s infinite;
      z-index: 2;
    }

    .rhythm-step-card.counted-done {
      border-color: #10b981;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.18), rgba(15, 23, 42, 0.95));
    }

    .rhythm-number-big {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
      margin: 6px 0 4px;
      background: linear-gradient(135deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rhythm-step-card.speaking-now .rhythm-number-big {
      background: linear-gradient(135deg, #fde047, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rhythm-visual-cluster {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 8px;
      margin: 6px 0;
      font-size: 16px;
    }

    .rhythm-mult-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      margin-top: 4px;
    }

    .rhythm-bubble-choice {
      min-width: 92px;
      padding: 16px 20px;
      font-size: 26px;
      font-weight: 900;
      border-radius: 18px;
      border: 3px solid #38bdf8 !important;
      background: linear-gradient(135deg, #1e293b, #0f172a) !important;
      color: #fff !important;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      transition: transform 0.1s ease;
    }

    /* Asla tıklanmış/seçilmiş kalmasın, tüm seçenekler her zaman aynı varsayılan görünümde kalsın */
    .rhythm-bubble-choice:focus,
    .rhythm-bubble-choice:focus-visible,
    .rhythm-bubble-choice:focus-within,
    .rhythm-bubble-choice:active,
    .rhythm-bubble-choice:visited {
      outline: none !important;
      border: 3px solid #38bdf8 !important;
      background: linear-gradient(135deg, #1e293b, #0f172a) !important;
      color: #fff !important;
      transform: none !important;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25) !important;
    }

    /* Dokunmatik ekranlarda imleç veya seçili kalma olmasın, yalnızca fareli masaüstünde hafif gezinme */
    @media (hover: hover) and (pointer: fine) {
      .rhythm-bubble-choice:hover {
        border: 3px solid #38bdf8 !important;
        background: linear-gradient(135deg, #1e293b, #0f172a) !important;
        transform: translateY(-2px);
      }
    }

    .rhythm-choice-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.25s ease-out;
    }

    .rhythm-choice-modal {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 26px 20px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(245,158,11,0.3);
    }

    .score-badge-circle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #fde047;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(16, 185, 129, 0.2));
      margin: 10px auto;
      box-shadow: 0 0 25px rgba(253, 224, 71, 0.35);
    }

    @media (max-width: 600px) {
      .rhythm-stage-tabs {
        grid-template-columns: 1fr;
      }
      .rhythm-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header-widgets .sound-btn {
        padding: 5px 8px;
        font-size: 11px;
      }
    }

    /* ========================================================
       YENİ ÖZELLİK VE ANİMASYON STİLLERİ
    ======================================================== */
    .badge-unlock-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #fde047;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10000;
      animation: slideInDown 0.4s ease;
      transition: all 0.4s ease;
    }
    @keyframes slideInDown {
      from { transform: translateY(-40px); opacity: 0; }

    /* ========================================================
       SES EFEKTLERİ SYNTHESIZER (WEB AUDIO API - SIFIR DOSYA BAĞIMLILIĞI)
    ======================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChimeSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.15, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.3);
          });
        } else if (type === 'rocket') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.7);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
        }
      } catch (e) {}
    }

        if (copyBtn) {

        navigator.clipboard.writeText(currentDocHtml).then(showSuccess).catch(() => {
          fallbackCopyText(currentDocHtml, showSuccess);
        });
      } else {
        fallbackCopyText(currentDocHtml, showSuccess);
      }

    function fallbackCopyText(text, callback) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        callback();
      } catch (err) {
        alert('Panoya kopyalanamadı. Lütfen "HTML İndir" butonunu kullanarak doğrudan dosyayı indirin.');
      }
      document.body.removeChild(ta);
    }

    /* ========================================================
       ÇİFT KATMANLI KALICI HAFIZA SİSTEMİ
       (LOCALSTORAGE + INDEXEDDB + PERSISTENT STORAGE KORUMASI)
       & YEDEKLEME / YEDEKTEN DÖNME MOTORU
    ======================================================== */
    const LINGO_IDB_NAME = 'LingoKaliciHafizaDB';
    const LINGO_IDB_VERSION = 1;
    const LINGO_IDB_STORE = 'app_memory_store';
    const LINGO_LAST_SAVED_KEY = 'lingo_last_saved_at';
    let lingoIdbInstance = null;
    let lingoMirrorSyncTimer = null;
    let isPersistentStorageGranted = false;

    function openLingoIndexedDB() {
      return new Promise((resolve) => {
        if (lingoIdbInstance) {
          resolve(lingoIdbInstance);
          return;
        }
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        try {
          const req = window.indexedDB.open(LINGO_IDB_NAME, LINGO_IDB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(LINGO_IDB_STORE)) {
              db.createObjectStore(LINGO_IDB_STORE, { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => {
            lingoIdbInstance = e.target.result;
            resolve(lingoIdbInstance);
          };
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    }

    function collectCurrentMemorySnapshot() {
      let parentLogs = {};
      let petState = null;
      let badges = [];
      let best60s = 0;
      try {
        const rawLogs = localStorage.getItem(PARENT_LOGS_STORAGE_KEY);
        if (rawLogs) parentLogs = JSON.parse(rawLogs);
      } catch (e) {}
      try {
        const rawPet = localStorage.getItem('lingo_pet_and_stars_v1');
        if (rawPet) petState = JSON.parse(rawPet);
      } catch (e) {}
      try {
        const rawBadges = localStorage.getItem('lingoday_badges');
        if (rawBadges) badges = JSON.parse(rawBadges);
      } catch (e) {}
      try {
        best60s = parseInt(localStorage.getItem('lingo_best_60s') || '0', 10) || 0;
      } catch (e) {}

      const nowIso = new Date().toISOString();
      try {
        localStorage.setItem(LINGO_LAST_SAVED_KEY, nowIso);
      } catch (e) {}

      return {
        id: 'full_snapshot',
        backupSchema: 'LINGO_BACKUP_V1',
        appVersion: typeof CURRENT_APP_VERSION !== 'undefined' ? CURRENT_APP_VERSION : '2.9.2',
        savedAt: nowIso,
        parentLogs: (parentLogs && typeof parentLogs === 'object') ? parentLogs : {},
        petState: (petState && typeof petState === 'object') ? petState : null,
        badges: Array.isArray(badges) ? badges : [],
        best60s: best60s
      };
    }

    async function syncAllDataToIndexedDB() {
      try {
        const db = await openLingoIndexedDB();
        if (!db) return;
        const snapshot = collectCurrentMemorySnapshot();
        const tx = db.transaction(LINGO_IDB_STORE, 'readwrite');
        const store = tx.objectStore(LINGO_IDB_STORE);
        store.put(snapshot);
      } catch (e) {}
    }

    function scheduleMemoryMirrorSync() {
      if (lingoMirrorSyncTimer) clearTimeout(lingoMirrorSyncTimer);
      lingoMirrorSyncTimer = setTimeout(() => {
        syncAllDataToIndexedDB();
      }, 350);
    }

    async function initPersistentMemorySystem() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          isPersistentStorageGranted = await navigator.storage.persist();
        }
      } catch (e) {}

      try {
        const db = await openLingoIndexedDB();
        if (!db) return;
        const tx = db.transaction(LINGO_IDB_STORE, 'readonly');
        const store = tx.objectStore(LINGO_IDB_STORE);
        const getReq = store.get('full_snapshot');
        getReq.onsuccess = () => {
          const idbSnap = getReq.result;
          if (idbSnap && typeof idbSnap === 'object') {
            let restoredAnything = false;

            // 1. Ebeveyn günlük kayıtları LocalStorage'da yoksa veya boşsa IndexedDB'den geri yükle
            const localLogsRaw = localStorage.getItem(PARENT_LOGS_STORAGE_KEY);
            let localLogsEmpty = true;
            if (localLogsRaw) {
              try {
                const parsed = JSON.parse(localLogsRaw);
                if (parsed && Object.keys(parsed).length > 0) {
                  // Sadece bugünün 0 saniyelik boş kaydı varsa ve IDB'de daha fazla veri varsa kontrol et
                  const keys = Object.keys(parsed);
                  const totalSecLocal = keys.reduce((acc, k) => acc + (parsed[k]?.activeSeconds || 0), 0);
                  const totalCorrLocal = keys.reduce((acc, k) => acc + (parsed[k]?.totalCorrect || 0), 0);
                  if (keys.length > 1 || totalSecLocal > 5 || totalCorrLocal > 0) {
                    localLogsEmpty = false;
                  }
                }
              } catch (e) {}
            }
            if (localLogsEmpty && idbSnap.parentLogs && Object.keys(idbSnap.parentLogs).length > 0) {
              localStorage.setItem(PARENT_LOGS_STORAGE_KEY, JSON.stringify(idbSnap.parentLogs));
              restoredAnything = true;
            }

            // 2. Yıldızlar ve Lingo Dostum verisi LocalStorage'da yoksa IndexedDB'den geri yükle
            const localPetRaw = localStorage.getItem('lingo_pet_and_stars_v1');
            if (!localPetRaw && idbSnap.petState) {
              localStorage.setItem('lingo_pet_and_stars_v1', JSON.stringify(idbSnap.petState));
              restoredAnything = true;
            }

            // 3. Rozetler LocalStorage'da yoksa IndexedDB'den geri yükle
            const localBadgesRaw = localStorage.getItem('lingoday_badges');
            if ((!localBadgesRaw || localBadgesRaw === '[]') && Array.isArray(idbSnap.badges) && idbSnap.badges.length > 0) {
              localStorage.setItem('lingoday_badges', JSON.stringify(idbSnap.badges));
              restoredAnything = true;
            }

            // 4. 60 Saniye rekoru
            const localBest = parseInt(localStorage.getItem('lingo_best_60s') || '0', 10) || 0;
            if (localBest === 0 && (idbSnap.best60s || 0) > 0) {
              localStorage.setItem('lingo_best_60s', String(idbSnap.best60s));
              if (typeof time60State !== 'undefined') time60State.bestScore = idbSnap.best60s;
              restoredAnything = true;
            }

            if (restoredAnything) {
              syncTodayTimerFromStorage();
              updateBadgeCountDisplay();
              if (typeof updateHeaderStarUI === 'function') updateHeaderStarUI();
              if (currentMainTab === 'menu' && typeof renderUnitsOverview === 'function') {
                renderUnitsOverview();
              }
              if (typeof showUpdateToast === 'function') {
                showUpdateToast('🛡️ Kalıcı Hafıza: İlerlemeniz ve yıldızlarınız yedek hafızadan geri yüklendi!');
              }
            }
          }
          // Mevcut durumu her halükarda IndexedDB ile eşitle
          syncAllDataToIndexedDB();
        };
      } catch (e) {}
    }

    function applyRestoredBackupSnapshot(data, mergeMode = true) {
      if (!data || typeof data !== 'object') {
        throw new Error('Geçersiz yedek verisi.');
      }
      const hasValidFields = data.parentLogs || data.petState || data.badges || data.backupSchema === 'LINGO_BACKUP_V1';
      if (!hasValidFields) {
        throw new Error('Bu dosya veya kod Lingo Ders Arkadaşım yedeği değil.');
      }

      // 1. Günlük Ebeveyn Kayıtlarını Birleştir veya Yükle
      if (data.parentLogs && typeof data.parentLogs === 'object') {
        const currentLogs = mergeMode ? loadAllParentLogs() : {};
        Object.keys(data.parentLogs).forEach(dateKey => {
          const incomingDay = data.parentLogs[dateKey];
          const existingDay = currentLogs[dateKey];
          if (!existingDay) {
            currentLogs[dateKey] = incomingDay;
          } else {
            // Aynı gün varsa en yüksek süreyi ve doğru/yanlış kayıtlarını koru
            const incSec = incomingDay.activeSeconds || 0;
            const exSec = existingDay.activeSeconds || 0;
            const incCorr = incomingDay.totalCorrect || 0;
            const exCorr = existingDay.totalCorrect || 0;
            if (incCorr >= exCorr && incSec >= exSec) {
              currentLogs[dateKey] = incomingDay;
            } else {
              existingDay.activeSeconds = Math.max(exSec, incSec);
              existingDay.totalCorrect = Math.max(exCorr, incCorr);
              existingDay.totalWrong = Math.max(existingDay.totalWrong || 0, incomingDay.totalWrong || 0);
            }
          }
        });
        localStorage.setItem(PARENT_LOGS_STORAGE_KEY, JSON.stringify(currentLogs));
      }

      // 2. Yıldız Kumbarası & Lingo Dostum Durumunu Yükle
      if (data.petState && typeof data.petState === 'object') {
        if (mergeMode) {
          const curPet = getPetState();
          const incPet = data.petState;
          const mergedPet = {
            ...curPet,
            ...incPet,
            stars: Math.max(curPet.stars || 0, incPet.stars || 0),
            xp: Math.max(curPet.xp || 0, incPet.xp || 0),
            level: Math.max(curPet.level || 1, incPet.level || 1),
            accessories: Array.from(new Set([...(curPet.accessories || []), ...(incPet.accessories || [])])),
            unlockedAvatars: Array.from(new Set([...(curPet.unlockedAvatars || ['hero']), ...(incPet.unlockedAvatars || ['hero'])]))
          };
          localStorage.setItem('lingo_pet_and_stars_v1', JSON.stringify(mergedPet));
        } else {
          localStorage.setItem('lingo_pet_and_stars_v1', JSON.stringify(data.petState));
        }
      }

      // 3. Rozetleri Birleştir veya Yükle
      if (Array.isArray(data.badges)) {
        const curBadges = mergeMode ? getUnlockedBadges() : [];
        const mergedBadges = Array.from(new Set([...curBadges, ...data.badges]));
        localStorage.setItem('lingoday_badges', JSON.stringify(mergedBadges));
      }

      // 4. 60 Saniye Rekoru
      if (typeof data.best60s === 'number' || typeof data.best60s === 'string') {
        const incBest = parseInt(data.best60s, 10) || 0;
        const curBest = parseInt(localStorage.getItem('lingo_best_60s') || '0', 10) || 0;
        const finalBest = mergeMode ? Math.max(curBest, incBest) : incBest;
        localStorage.setItem('lingo_best_60s', String(finalBest));
        if (typeof time60State !== 'undefined') time60State.bestScore = finalBest;
      }

      // Güncel zamanı ve sayacı senkronize et
      syncTodayTimerFromStorage();
      updateBadgeCountDisplay();
      if (typeof updateHeaderStarUI === 'function') updateHeaderStarUI();
      syncAllDataToIndexedDB();
      if (currentMainTab === 'menu' && typeof renderUnitsOverview === 'function') {
        renderUnitsOverview();
      }
    }

    function restoreFromParentBackupCode() {
      recordActivity();
      const inputEl = document.getElementById('parentRestoreCodeInput');
      const statusBox = document.getElementById('parentBackupActionStatus');
      if (!inputEl) return;
      let rawText = (inputEl.value || '').trim();
      if (!rawText) {
        if (statusBox) {
          statusBox.style.display = 'block';
          statusBox.style.background = 'rgba(239,68,68,0.2)';
          statusBox.style.borderColor = '#ef4444';
          statusBox.style.color = '#fca5a5';
          statusBox.innerHTML = '⚠️ Lütfen önce kopyaladığınız yedek kodunu kutuya yapıştırın.';
        }
        return;
      }
      try {
        if (rawText.includes('LINGO-YEDEK-V1:')) {
          rawText = rawText.split('LINGO-YEDEK-V1:')[1].trim();
        }
        let parsed = null;
        if (rawText.startsWith('{')) {
          parsed = JSON.parse(rawText);
        } else {

    function getOrCreateTodayLog() {
      const todayKey = getTodayDateKey();
      const allLogs = loadAllParentLogs();
      if (!allLogs[todayKey]) {
        allLogs[todayKey] = createEmptyDayLog(todayKey);
        saveAllParentLogs(allLogs);
      } else {
        // Eksik kategori varsa tamamla
        if (!allLogs[todayKey].categories) allLogs[todayKey].categories = {};
        Object.keys(PARENT_CATEGORY_LABELS).forEach(k => {
          if (!allLogs[todayKey].categories[k]) {
            allLogs[todayKey].categories[k] = { correct: 0, wrong: 0, completed: 0 };
          }
        });
        if (!Array.isArray(allLogs[todayKey].successes)) allLogs[todayKey].successes = [];
        if (!Array.isArray(allLogs[todayKey].mistakes)) allLogs[todayKey].mistakes = [];
        if (!Array.isArray(allLogs[todayKey].milestones)) allLogs[todayKey].milestones = [];
        if (!Array.isArray(allLogs[todayKey].visitedLessons)) allLogs[todayKey].visitedLessons = [];
      }
      return { todayKey, todayLog: allLogs[todayKey], allLogs };
    }

    function formatTimerClock(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatDurationHuman(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) return `${hrs} saat ${mins} dk ${secs} sn`;
      if (mins > 0) return `${mins} dk ${secs} sn`;
      return `${secs} saniye`;
    }

    function updateStudyTimerDisplay() {
      const textEl = document.getElementById('studyTimerText');
      if (textEl) {
        textEl.textContent = formatTimerClock(totalSeconds);
      }
      const liveParentEl = document.getElementById('parentTodayLiveDuration');
      if (liveParentEl && selectedParentDashboardDateKey === getTodayDateKey()) {
        liveParentEl.textContent = formatDurationHuman(totalSeconds);
      }
    }

    function syncTodayTimerFromStorage() {
      const { todayKey, todayLog } = getOrCreateTodayLog();
      currentTrackingDateKey = todayKey;
      totalSeconds = todayLog.activeSeconds || 0;
      updateStudyTimerDisplay();
    }

    function persistCurrentSecondsToStorage() {
      const { todayKey, todayLog, allLogs } = getOrCreateTodayLog();
      if (currentTrackingDateKey && currentTrackingDateKey !== todayKey) {
        // Gün değiştiyse yeni güne sıfırdan başla
        currentTrackingDateKey = todayKey;
        totalSeconds = 0;
      }
      todayLog.activeSeconds = totalSeconds;
      allLogs[todayKey] = todayLog;
      saveAllParentLogs(allLogs);
    }

    function checkIsScreenActive() {
      return document.visibilityState === 'visible' && !document.hidden && isAppInForeground;
    }

    function updateTimerPauseState() {
      const badgeEl = document.getElementById('studyTimerBadge');
      if (checkIsScreenActive()) {
        isPaused = false;
        if (badgeEl) badgeEl.classList.remove('paused');
      } else {
        isPaused = true;
        if (badgeEl) badgeEl.classList.add('paused');
        persistCurrentSecondsToStorage();
      }
    }

    // Başlangıçta bugünün süresini hafızadan yükle
    syncTodayTimerFromStorage();

    // Ekranda açık olduğu sürece her saniye ilerler, arka plana geçince durur, yeni günde sıfırlanır
    setInterval(() => {
      const nowKey = getTodayDateKey();
      if (currentTrackingDateKey !== nowKey) {
        currentTrackingDateKey = nowKey;
        totalSeconds = 0;
        persistCurrentSecondsToStorage();
        updateStudyTimerDisplay();
      }

      if (checkIsScreenActive()) {
        isPaused = false;
        const badgeEl = document.getElementById('studyTimerBadge');
        if (badgeEl) badgeEl.classList.remove('paused');
        totalSeconds++;
        persistCurrentSecondsToStorage();
        updateStudyTimerDisplay();
      } else {
        isPaused = true;
        const badgeEl = document.getElementById('studyTimerBadge');
        if (badgeEl) badgeEl.classList.add('paused');
      }
    }, 1000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        isAppInForeground = true;
        syncTodayTimerFromStorage();
      } else {
        isAppInForeground = false;
      }
      updateTimerPauseState();
    });

    window.addEventListener('blur', () => {
      if (document.hidden) {
        isAppInForeground = false;
        updateTimerPauseState();
      }
    });

    window.addEventListener('focus', () => {
      isAppInForeground = true;
      syncTodayTimerFromStorage();
      updateTimerPauseState();
    });

    window.addEventListener('pagehide', () => {
      isAppInForeground = false;
      persistCurrentSecondsToStorage();
    });

    window.addEventListener('pageshow', () => {
      isAppInForeground = true;
      syncTodayTimerFromStorage();

    });

    function recordActivity() {
      isAppInForeground = true;
      if (isPaused && document.visibilityState === 'visible') {
        isPaused = false;
        const badgeEl = document.getElementById('studyTimerBadge');
        if (badgeEl) badgeEl.classList.remove('paused');

    // GÜNLÜK EBEVEYN KAYIT FONKSİYONLARI (ÇÖZDÜKLERİ, BAŞARDIKLARI VE ZORLANDIKLARI)
    function recordParentActivityLog(categoryKey, isSuccess, itemTitle, detailText) {
      try {
        const { todayKey, todayLog, allLogs } = getOrCreateTodayLog();
        todayLog.activeSeconds = totalSeconds;
        const catInfo = PARENT_CATEGORY_LABELS[categoryKey] || { title: '📚 Genel Çalışma' };
        if (!todayLog.categories[categoryKey]) {
          todayLog.categories[categoryKey] = { correct: 0, wrong: 0, completed: 0 };
        }
        const entry = {
          time: getCurrentTimeHHMM(),
          categoryKey,
          categoryTitle: catInfo.title,
          item: itemTitle,
          detail: detailText
        };
        if (isSuccess) {
          todayLog.totalCorrect = (todayLog.totalCorrect || 0) + 1;
          todayLog.categories[categoryKey].correct++;
          todayLog.successes.unshift(entry);
          if (todayLog.successes.length > 150) todayLog.successes.pop();
        } else {
          todayLog.totalWrong = (todayLog.totalWrong || 0) + 1;
          todayLog.categories[categoryKey].wrong++;
          todayLog.mistakes.unshift(entry);
          if (todayLog.mistakes.length > 150) todayLog.mistakes.pop();
        }
        allLogs[todayKey] = todayLog;
        saveAllParentLogs(allLogs);
        if (isSuccess) {
          if (typeof addStarCoins === 'function') addStarCoins(2, false);
          if (typeof updateDailyQuestProgress === 'function') updateDailyQuestProgress(categoryKey);
        }
      } catch (e) {}
    }

    function recordParentMilestone(categoryKey, milestoneTitle, scoreSummary) {
      try {
        const { todayKey, todayLog, allLogs } = getOrCreateTodayLog();
        todayLog.activeSeconds = totalSeconds;
        if (todayLog.categories[categoryKey]) {
          todayLog.categories[categoryKey].completed++;
        }
        todayLog.milestones.unshift({
          time: getCurrentTimeHHMM(),
          title: milestoneTitle,
          summary: scoreSummary
        });
        if (todayLog.milestones.length > 60) todayLog.milestones.pop();
        allLogs[todayKey] = todayLog;
        saveAllParentLogs(allLogs);
        if (typeof addStarCoins === 'function') addStarCoins(10, true);
      } catch (e) {}
    }

    function recordParentVisitedLesson(lessonTitle) {
      try {
        if (!lessonTitle) return;
        const { todayKey, todayLog, allLogs } = getOrCreateTodayLog();
        if (!todayLog.visitedLessons.includes(lessonTitle)) {
          todayLog.visitedLessons.push(lessonTitle);
          allLogs[todayKey] = todayLog;
          saveAllParentLogs(allLogs);
        }
      } catch (e) {}
    }

    /* ========================================================
       EBEVEYN GÜVENLİK KİLİDİ (HER SEFERİNDE FARKLI SORU)
       VE DETAYLI GÜNLÜK EBEVEYN RAPOR EKRANI
    ======================================================== */
    function generateUniqueParentGateQuestion() {
      const questionGenerators = [
        () => {
          const pairs = [
            [10, 5], [10, 8], [12, 8], [15, 5], [10, 15],
            [20, 10], [14, 6], [20, 5], [15, 10], [25, 5]
          ];
          const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
          return {
            prompt: `${a} + ${b} işleminin sonucu kaçtır?`,
            hint: 'Hızlı ebeveyn doğrulaması için basit toplama işlemi.',
            correct: a + b
          };
        },
        () => {
          const pairs = [
            [20, 5], [15, 5], [30, 10], [25, 5], [18, 8],
            [20, 10], [16, 6], [24, 4], [40, 10]
          ];
          const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
          return {
            prompt: `${a} - ${b} işleminin sonucu kaçtır?`,
            hint: 'Hızlı ebeveyn doğrulaması için basit çıkarma işlemi.',
            correct: a - b
          };
        },
        () => {
          const pairs = [
            [2, 6], [2, 8], [3, 4], [3, 5], [4, 4],
            [5, 3], [5, 4], [2, 9], [3, 6], [4, 5]
          ];
          const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
          return {
            prompt: `${a} × ${b} işleminin sonucu kaçtır?`,
            hint: 'Hızlı ebeveyn doğrulaması için basit çarpma işlemi.',
            correct: a * b
          };
        },
        () => {
          const dailyQuestions = [
            { prompt: '1 haftada toplam kaç gün vardır?', hint: 'Pazartesi\'den Pazar\'a kadar gün sayısı.', correct: 7 },
            { prompt: '1 yılda toplam kaç ay vardır?', hint: 'Ocak\'tan Aralık\'a kadar ay sayısı.', correct: 12 },
            { prompt: '1 günde toplam kaç saat vardır?', hint: 'Bir tam gündeki saat sayısı.', correct: 24 },
            { prompt: 'İki elimizde toplam kaç parmak vardır?', hint: '5 + 5 işleminin sonucu.', correct: 10 }
          ];
          return dailyQuestions[Math.floor(Math.random() * dailyQuestions.length)];
        }
      ];

      let candidate = null;
      for (let attempt = 0; attempt < 12; attempt++) {
        const gen = questionGenerators[Math.floor(Math.random() * questionGenerators.length)];
        candidate = gen();
        if (candidate.prompt !== lastParentQuestionSignature) {
          break;
        }
      }
      lastParentQuestionSignature = candidate.prompt;

      const choicesSet = new Set([candidate.correct]);
      const offsets = [-5, -4, -3, -2, 2, 3, 4, 5, 6];
      while (choicesSet.size < 4) {
        const off = offsets[Math.floor(Math.random() * offsets.length)];
        const val = candidate.correct + off;
        if (val > 1) choicesSet.add(val);
      }
      candidate.options = Array.from(choicesSet).sort((a, b) => a - b);
      return candidate;
    }

    function shareParentDailyReportWhatsApp(dateKey) {
      const { allLogs } = getOrCreateTodayLog();
      const d = allLogs[dateKey];
      if (!d) return;
      const tot = (d.totalCorrect || 0) + (d.totalWrong || 0);
      const pct = tot > 0 ? Math.round((d.totalCorrect / tot) * 100) : 0;
      const msg = `📊 *Lingo Ders Arkadaşım - Günlük Ebeveyn Raporu*\n📅 Tarih: ${d.dateLabel}\n⏱️ Günlük Kullanım Süresi: ${formatDurationHuman(d.activeSeconds || 0)}\n✅ Başardığı (Doğru): ${d.totalCorrect || 0}\n⚠️ Zorlandığı (Hata): ${d.totalWrong || 0}\n🎯 Başarı Oranı: %${pct}`;
      openWhatsAppShare(msg);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function speakText(text) {
      recordActivity();
      if (!soundEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    function speakTurkish(text, rate = 0.92, onEndCallback = null) {
      recordActivity();
      if (!soundEnabled || !window.speechSynthesis) {
        if (onEndCallback) setTimeout(onEndCallback, 900);
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR';
      u.rate = rate;
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const trVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
      if (trVoice) u.voice = trVoice;
      let finished = false;
      const done = () => {
        if (!finished) {
          finished = true;
          if (onEndCallback) onEndCallback();
        }
      };
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
    }

    };

    let rhythmActiveMode = 2;          // 2, 3, 4 veya 5
    let rhythmCountDirection = 'forward'; // 'forward' (İleriye Sayma) veya 'backward' (Geriye Sayma / Roket Modu)
    let rhythmActiveStage = 'learn';   // 'learn' (1. Öğret & Say), 'practice' (2. Çocuk Saysın), 'exam' (3. Sınav)
    let rhythmTeachSpeechStyle = 'short'; // 'short' (Sadece 3, 6, 9...) veya 'mult' (1 tane 3, 3 eder...)
    let rhythmAutoPlaying = false;
    let rhythmCurrentHighlightStep = 0; // 1..10
    let rhythmTeachCompletedOnce = false;
    let rhythmAutoTimer = null;

    // 2. Aşama (Çocuğun Sayması) State
    let rhythmPracticeTargetStep = 1;  // 1..10 (sıradaki çocuğun söyleyeceği adım)
    let rhythmPracticeWrongFeedback = '';
    let rhythmPracticeCompleted = false;
    let rhythmPracticeChoices = [];
    let rhythmVoiceListening = false;

    // 1. Aşama Sayma Bitiş Seçim Modalı
    let rhythmTeachChoiceDialog = false;

    // 2. Aşama İstatistik & Parmak Hesabı Ölçüm State'i
    let rhythmPracticeStartTime = null;
    let rhythmPracticeEndTime = null;
    let rhythmPracticeDuration = 0; // saniye
    let rhythmPracticeTotalMistakes = 0;
    let rhythmCurrentStepAttempts = 1; // aktif adımda kaçıncı deneme
    let rhythmPracticeStepStats = []; // [{ step, num, tr, attempts, mistakes }]

    // 3. Aşama (Sınav) State
    let rhythmExamFilter = 'both'; // '3', '4', 'both'
    let rhythmExamQuestions = [];
    let rhythmExamIndex = 0;
    let rhythmExamScore = 0;
    let rhythmExamStreak = 0;
    let rhythmExamBestStreak = 0;
    let rhythmExamFirstTry = 0;
    let rhythmExamWrongCurrent = 0;
    let rhythmExamWrongClicked = [];
    let rhythmExamAnswered = false;
    let rhythmBestExamScore = 0;

    function selectRhythmStepAndOpen(mode, stage) {
      stopRhythmAutoTeach();
      if (typeof stopChildVoiceCount === 'function') stopChildVoiceCount();
      rhythmActiveMode = mode;
      rhythmActiveStage = stage || 'learn';
      if (rhythmActiveStage === 'practice') {
        rhythmPracticeStartTime = null; // openRhythmicCountingModule içinde temiz başlatılsın
      }
      switchMainTab('rhythmic');
    }

    function openRhythmicCountingModule() {
      if (rhythmActiveStage === 'practice') {
        initRhythmPractice();
        return;
      }
      if (rhythmActiveStage === 'exam') {
        initRhythmExam(String(rhythmActiveMode));
        return;
      }
      renderRhythmicCounting();
      // Kullanıcı girdiğinde önce otomatik olarak öğretsin ve sesli saysın!
      if (rhythmActiveStage === 'learn' && !rhythmAutoPlaying) {
        setTimeout(() => {
          if (currentMainTab === 'rhythmic' && rhythmActiveStage === 'learn') {
            startRhythmAutoTeach();
          }
        }, 350);
      }
    }

    function stopRhythmAutoTeach() {
      rhythmAutoPlaying = false;
      if (rhythmAutoTimer) {
        clearTimeout(rhythmAutoTimer);
        rhythmAutoTimer = null;
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function switchRhythmMode(newMode) {
      recordActivity();
      stopRhythmAutoTeach();
      rhythmActiveMode = newMode;
      rhythmCurrentHighlightStep = 0;
      rhythmTeachCompletedOnce = false;
      if (rhythmActiveStage === 'practice') {
        initRhythmPractice();
      } else if (rhythmActiveStage === 'exam') {
        rhythmExamFilter = String(newMode);
        initRhythmExam(rhythmExamFilter);
      } else {
        renderRhythmicCounting();
        setTimeout(() => {
          if (currentMainTab === 'rhythmic' && rhythmActiveStage === 'learn') {
            startRhythmAutoTeach();
          }
        }, 250);
      }
    }


    function toggleRhythmDirection(dir) {
      recordActivity();
      stopRhythmAutoTeach();
      rhythmCountDirection = dir;
      rhythmCurrentHighlightStep = 0;
      rhythmTeachCompletedOnce = false;
      if (rhythmActiveStage === 'practice') {
        initRhythmPractice();
      } else {
        renderRhythmicCounting();
        if (rhythmActiveStage === 'learn') {
          setTimeout(() => startRhythmAutoTeach(), 250);
        }
      }
    }

    function switchRhythmStage(newStage) {
      recordActivity();
      stopRhythmAutoTeach();
      if (typeof stopChildVoiceCount === 'function') stopChildVoiceCount();
      rhythmActiveStage = newStage;
      if (newStage === 'learn') {
        renderRhythmicCounting();
      } else if (newStage === 'practice') {
        initRhythmPractice();
      } else if (newStage === 'exam') {
        initRhythmExam(String(rhythmActiveMode));
      }
    }

    function toggleRhythmTeachStyle(style) {
      recordActivity();
      stopRhythmAutoTeach();
      rhythmTeachSpeechStyle = style;
      renderRhythmicCounting();
      startRhythmAutoTeach();
    }

    function startRhythmAutoTeach() {
      recordActivity();
      stopRhythmAutoTeach();
      rhythmAutoPlaying = true;
      rhythmTeachCompletedOnce = false;
      rhythmCurrentHighlightStep = 1;
      renderRhythmicCounting();

      const info = rhythmData[rhythmActiveMode];
      let introText = "";
      if (rhythmCountDirection === 'backward') {
        const modeSay = (rhythmActiveMode === 2) ? "2'şer 2'şer" :
                         (rhythmActiveMode === 3) ? "3'er 3'er" :
                         (rhythmActiveMode === 4) ? "4'er 4'er" : "5'er 5'er";
        introText = `Roket Modu! Haydi ${info.maxNumber}'den geriye doğru ${modeSay} sayalım ve roketi fırlatalım!`;
      } else {
        const introMap = {
          2: "Haydi 2'şer 2'şer 20'ye kadar beraber sayalım ve öğrenelim!",
          3: "Haydi 3'er 3'er 30'a kadar beraber sayalım ve öğrenelim!",
          4: "Haydi 4'er 4'er 40'a kadar beraber sayalım ve öğrenelim!",
          5: "Haydi 5'er 5'er 50'ye kadar beraber sayalım ve öğrenelim!"
        };
        introText = introMap[rhythmActiveMode] || `Haydi ${rhythmActiveMode}'er ${info.maxNumber}'ye kadar beraber sayalım ve öğrenelim!`;
      }

      speakTurkish(introText, 0.95, () => {
        if (!rhythmAutoPlaying) return;
        playNextRhythmTeachStep(1);
      });
    }

    function playNextRhythmTeachStep(stepIndex) {
      if (!rhythmAutoPlaying || currentMainTab !== 'rhythmic' || rhythmActiveStage !== 'learn') return;
      const info = rhythmData[rhythmActiveMode];
      if (stepIndex > info.steps.length) {
        rhythmAutoPlaying = false;
        rhythmCurrentHighlightStep = 0;
        rhythmTeachCompletedOnce = true;
        rhythmTeachChoiceDialog = true; // Sayma bitti uyarısı / modalı
        renderRhythmicCounting();
        speakTurkish("Harika dinledin! Sayma tamamlandı. Tekrar sayayım mı, yoksa sonraki aşamaya geçelim mi?", 0.95);
        return;
      }

      rhythmCurrentHighlightStep = stepIndex;
      renderRhythmicCounting();

      // Aktif kartı ekranda görünür tut
      const activeEl = document.getElementById(`rhythm_card_${stepIndex}`);
      if (activeEl && activeEl.scrollIntoView) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const item = info.steps[stepIndex - 1];
      const speech = rhythmTeachSpeechStyle === 'mult' ? item.speakTeach : item.tr;

      speakTurkish(speech, 0.9, () => {
        if (!rhythmAutoPlaying) return;
        rhythmAutoTimer = setTimeout(() => {
          playNextRhythmTeachStep(stepIndex + 1);
        }, 420);
      });
    }

    function speakSingleRhythmCard(stepIndex) {
      recordActivity();
      stopRhythmAutoTeach();
      rhythmCurrentHighlightStep = stepIndex;
      renderRhythmicCounting();
      const item = rhythmData[rhythmActiveMode].steps[stepIndex - 1];
      speakTurkish(`${item.tr}. ${item.explain}`, 0.92);
    }

    // 2. AŞAMA: SIRA SENDE (ÇOCUĞUN SAYMASI & SÜRE/PARMAK HESABI ANALİZİ)
    function initRhythmPractice() {
      if (typeof stopChildVoiceCount === 'function') stopChildVoiceCount();
      // Sınav başlarken ilk mikrofon KAPALI gelsin; çocuk bir defa basınca sürekli açık kalsın
      rhythmAutoMicEnabled = false;
      rhythmVoiceListening = false;
      rhythmLastHeardText = '';
      rhythmLastVoiceStepMatched = 0;
      rhythmLastVoiceMatchTime = 0;

      rhythmPracticeTargetStep = 1;
      rhythmPracticeWrongFeedback = '';
      rhythmPracticeCompleted = false;
      rhythmPracticeStartTime = Date.now();
      rhythmPracticeEndTime = null;
      rhythmPracticeDuration = 0;
      rhythmPracticeTotalMistakes = 0;
      rhythmCurrentStepAttempts = 1;
      rhythmPracticeStepStats = [];
      generateRhythmPracticeChoices();
      renderRhythmicCounting();
      const info = rhythmData[rhythmActiveMode];
      const modeSay = (rhythmActiveMode === 2) ? "2'şer 2'şer" :
                      (rhythmActiveMode === 3) ? "3'er 3'er" :
                      (rhythmActiveMode === 4) ? "4'er 4'er" : "5'er 5'er";
      speakTurkish(`Şimdi sıra sende! ${modeSay} ${info.maxNumber}'e kadar sen sayıyorsun! İstersen mikrofonu bir kez açıp arka arkaya söyleyebilirsin!`, 0.95, () => {
        // Öğretmenin giriş konuşması bittiğinde çocuk henüz 1. adımdaysa süreyi şimdi başlat
        if (rhythmPracticeTargetStep === 1 && !rhythmPracticeCompleted && rhythmPracticeStepStats.length === 0) {
          rhythmPracticeStartTime = Date.now();
        }
      });
    }

    function generateRhythmPracticeChoices() {
      const info = rhythmData[rhythmActiveMode];
      if (rhythmPracticeTargetStep > info.steps.length) {
        rhythmPracticeChoices = [];
        return;
      }
      const correctNum = info.steps[rhythmPracticeTargetStep - 1].num;
      const distractors = new Set();
      const candidates = [
        correctNum + 1,
        correctNum - 1,
        correctNum + 2,
        correctNum + info.stepSize,
        Math.max(1, correctNum - info.stepSize),
        correctNum + 3
      ].filter(n => n > 0 && n !== correctNum && n <= info.maxNumber + 6);

      while (distractors.size < 3 && candidates.length > 0) {
        const pick = candidates.splice(Math.floor(Math.random() * candidates.length), 1)[0];
        distractors.add(pick);
      }
      rhythmPracticeChoices = [correctNum, ...Array.from(distractors)].sort((a, b) => a - b);
    }

    function handleChildCountChoice(chosenNum, btnElem, fromVoice = false) {
      recordActivity();
      if (btnElem && typeof btnElem.blur === 'function') btnElem.blur();
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
      if (window.getSelection) {
        try { window.getSelection().removeAllRanges(); } catch (e) {}
      }
      const info = rhythmData[rhythmActiveMode];
      const currentItem = info.steps[rhythmPracticeTargetStep - 1];
      if (!currentItem) return;

      // Eğer başlangıç zamanı herhangi bir sebeple geçersizse hemen düzelt
      const nowCheck = Date.now();
      if (typeof rhythmPracticeStartTime !== 'number' || rhythmPracticeStartTime < 1700000000000 || rhythmPracticeStartTime > nowCheck) {
        rhythmPracticeStartTime = nowCheck - (rhythmPracticeTargetStep * 2000);
      }

      if (chosenNum === currentItem.num) {
        // Doğru seçim: Bu adımın kaçıncı denemede doğru bilindiğini kaydet
        rhythmPracticeStepStats.push({
          step: currentItem.step,
          num: currentItem.num,
          tr: currentItem.tr,
          attempts: rhythmCurrentStepAttempts,
          mistakes: rhythmCurrentStepAttempts - 1
        });
        rhythmCurrentStepAttempts = 1;
        rhythmPracticeWrongFeedback = '';
        recordParentActivityLog('math_rhythm', true, `${info.stepSize}'er Ritmik Sayma (${currentItem.step}. Adım)`, `Doğru sayı: ${currentItem.num} (${currentItem.tr})`);

        if (rhythmPracticeTargetStep >= info.steps.length) {
          rhythmAutoMicEnabled = false;
          stopChildVoiceCount();
          // TÜM SAYILAR AÇILDI! BAŞARI VE SÜRE HESAPLAMA (Saçma büyük sayıları %100 engelleyen güvenli hesap)
          const endMs = Date.now();
          const validStartMs = (typeof rhythmPracticeStartTime === 'number' && rhythmPracticeStartTime > 1700000000000 && rhythmPracticeStartTime <= endMs)
            ? rhythmPracticeStartTime
            : (endMs - 18000);
          rhythmPracticeEndTime = endMs;
          const rawElapsedSec = Math.round((rhythmPracticeEndTime - validStartMs) / 1000);
          rhythmPracticeDuration = Math.max(2, Math.min(300, rawElapsedSec));

          rhythmPracticeCompleted = true;
          renderRhythmicCounting();
          const stats = calculateRhythmPracticeScore(rhythmPracticeDuration, rhythmPracticeTotalMistakes);
          recordParentMilestone('math_rhythm', `${info.stepSize}'er ${rhythmCountDirection === 'backward' ? 'Geriye' : 'İleriye'} Ritmik Sayma`, `${stats.totalScore}/100 Puan • Süre: ${rhythmPracticeDuration} sn • Hata: ${rhythmPracticeTotalMistakes} (${stats.fingerCountingStatus})`);
          speakTurkish(`${currentItem.tr}! Harikasın şampiyon, tamamladın! Süren ${rhythmPracticeDuration} saniye, puanın 100 üzerinden ${stats.totalScore}! ${stats.voiceFeedback}`, 0.94);
        } else {
          rhythmPracticeTargetStep++;
          generateRhythmPracticeChoices();
          renderRhythmicCounting();

          // Eğer sürekli mikrofon açıksa bekletmemek için uzun konuşma yapma, anında zil çal ve dinlemeye devam et!
          if (fromVoice || rhythmAutoMicEnabled) {
            playChimeSound('correct');
          } else {
            speakTurkish(`Aferin, ${currentItem.tr}! Sıradaki sayı kaç?`, 0.95);
          }
        }
      } else {
        rhythmPracticeTotalMistakes++;
        rhythmCurrentStepAttempts++;
        recordParentActivityLog('math_rhythm', false, `${info.stepSize}'er Ritmik Sayma (${currentItem.step}. Adım)`, `Doğru sayı ${currentItem.num} iken ${chosenNum} seçti`);
        rhythmPracticeWrongFeedback = `❌ ${chosenNum} değil! İpucu: ${rhythmPracticeTargetStep} tane ${info.stepSize} (${rhythmPracticeTargetStep} × ${info.stepSize}) kaç eder?`;
        renderRhythmicCounting();
        if (fromVoice || rhythmAutoMicEnabled) {
          playChimeSound('wrong');
        } else {
          speakTurkish(`Tekrar dene! ${rhythmPracticeTargetStep} tane ${info.stepSize} kaç eder?`, 0.95);
        }
      }
    }

    // PEDAGOJİK PARMAK HESABI VE HIZ ANALİZ MOTORU
    function calculateRhythmPracticeScore(durationSec, totalMistakes) {
      if (rhythmCountDirection === 'backward') {
        unlockBadge('rocket_pilot');
        playChimeSound('rocket');
      } else {
        unlockBadge('rhythm_' + rhythmActiveMode);
        playChimeSound('correct');
      }
      // 10 basamak için ezbere süre: 18 - 25 saniye (basamak başı ~2 saniye)
      // Parmakla sayıyorsa basamak başı 5-8 saniye (toplam > 50-60 saniye) sürer.
      let speedScore = 50;
      let fingerCountingStatus = '';
      let fingerCountingIcon = '⚡';
      let fingerCountingColor = '#10b981';
      let voiceFeedback = '';
      let pedagojikNot = '';

      if (durationSec <= 22) {
        speedScore = 50;
        fingerCountingStatus = 'YILDIRIM EZBER (Parmak Hesabı YOK!)';
        fingerCountingIcon = '⚡';
        fingerCountingColor = '#10b981';
        voiceFeedback = 'Harika! Parmak hesabı yapmadan şarkı gibi ezbere bildin!';
        pedagojikNot = 'Mükemmel akıcılık! Sayılar hafızaya tam yerleşmiş, parmak hesabı yapmadan yıldırım gibi bitirdin.';
      } else if (durationSec <= 32) {
        speedScore = 44;
        fingerCountingStatus = 'ÇOK HIZLI (Parmak Hesabı Yok)';
        fingerCountingIcon = '👏';
        fingerCountingColor = '#38bdf8';
        voiceFeedback = 'Çok hızlısın! Parmak hesabı yapmadan gayet akıcı tamamladın.';
        pedagojikNot = 'Çok iyi! Neredeyse hiç duraksamadan, ritmi bozmadan akıcı bir şekilde tamamlandı.';
      } else if (durationSec <= 48) {
        speedScore = 30;
        fingerCountingStatus = 'ORTA HIZ (Hafif Parmak Hesabı Şüphesi)';
        fingerCountingIcon = '✋';
        fingerCountingColor = '#f59e0b';
        voiceFeedback = 'Bitirdin ama bazı sayılarda parmakla saydın gibi! Pratikle hızlanacaksın.';
        pedagojikNot = 'Ortalama basamak süresi 3-4 saniyeyi bulduğu için bazı adımlarda parmak hesabı yapılmış olabilir. Birkaç tekrarla tamamen ezbere geçilebilir.';
      } else if (durationSec <= 65) {
        speedScore = 18;
        fingerCountingStatus = 'YAVAŞ (Parmak Hesabı Yapılıyor)';
        fingerCountingIcon = '🐢';
        fingerCountingColor = '#f97316';
        voiceFeedback = 'Parmakla tek tek saydığın için süre uzadı. Hedefimiz parmaksız ezber!';
        pedagojikNot = 'Basamak başı 5-6 saniye sürüyor; çocuk sayıları zihinden ekleyerek veya parmakla sayarak buluyor. Hedefimiz ritmi şarkı gibi parmaksız ezberletmek.';
      } else {
        speedScore = 8;
        fingerCountingStatus = 'YOĞUN PARMAK HESABI TESPİT EDİLDİ';
        fingerCountingIcon = '🖐️';
        fingerCountingColor = '#ef4444';
        voiceFeedback = 'Parmak hesabı tespit edildi! Haydi testi başa alıp tekrar deneyelim!';
        pedagojikNot = 'Süre 65 saniyenin üzerinde; sayıları ezberden değil parmakla tek tek sayarak buluyor. 1. Aşamayı bir kez daha dinleyip testi baştan alması çok faydalı olacaktır.';
      }

      // Hata puanı: 50 puan üzerinden, her hata -6 puan
      const mistakePenalty = totalMistakes * 6;
      const accuracyScore = Math.max(0, 50 - mistakePenalty);
      const totalScore = Math.max(10, Math.min(100, speedScore + accuracyScore));

      return {
        speedScore,
        accuracyScore,
        totalScore,
        fingerCountingStatus,
        fingerCountingIcon,
        fingerCountingColor,
        voiceFeedback,
        pedagojikNot,
        idealDuration: 20
      };
    }

    // Başlangıçta mikrofon KAPALI; çocuk 1 kez basınca sürekli açık kalır
    let rhythmAutoMicEnabled = false;
    let rhythmSpeechRecognizer = null;
    let rhythmAutoMicRestartTimer = null;
    let rhythmLastHeardText = '';
    let rhythmLastVoiceStepMatched = 0;
    let rhythmLastVoiceMatchTime = 0;
    let rhythmConsumedResultIdx = -1;
    let rhythmConsumedWordCount = 0;

    // Türkçe sayı okunuşlarını ve rakamları hızlıca eşleştiren yardımcı fonksiyon
    function doesTranscriptMatchRhythmItem(rawTranscript, item) {
      if (!rawTranscript || !item) return false;
      const text = rawTranscript.toLowerCase().replace(/[.,!?-]/g, ' ').trim();
      if (!text) return false;
      const targetNumStr = String(item.num);
      const targetTrLower = item.tr.toLowerCase().trim();
      const targetTrCompact = targetTrLower.replace(/\s+/g, '');
      const textCompact = text.replace(/\s+/g, '');

      // 1. Kelime sınırıyla rakam kontrolü (örn. "3", "12", "24")
      const tokens = text.split(/\s+/).filter(Boolean);
      if (tokens.includes(targetNumStr)) return true;

      // 2. Tek kelimelik sayılarda tam kelime eşleşmesi ("on" ile "on iki" karışmasın)
      const isMultiWord = targetTrLower.includes(' ');
      if (!isMultiWord) {
        if (tokens.includes(targetTrLower)) return true;
      } else {
        if (text.includes(targetTrLower) || textCompact.includes(targetTrCompact)) return true;
      }

      // 3. Çocuk telaffuzlarında sık karşılaşılan yakın ses eşleşmeleri
      const aliases = {
        2: ['iki', '2'],
        3: ['üç', 'uc', 'üc', '3'],
        4: ['dört', 'dort', '4'],
        5: ['beş', 'bes', '5'],
        6: ['altı', 'alti', '6'],
        8: ['sekiz', '8'],
        9: ['dokuz', '9'],
        10: ['on', '10'],
        12: ['on iki', 'oniki', '12'],
        14: ['on dört', 'ondört', 'ondort', '14'],
        15: ['on beş', 'onbeş', 'onbes', '15'],
        16: ['on altı', 'onaltı', 'onalti', '16'],
        18: ['on sekiz', 'onsekiz', '18'],
        20: ['yirmi', '20'],
        21: ['yirmi bir', 'yirmibir', '21'],
        24: ['yirmi dört', 'yirmidört', 'yirmidort', '24'],
        25: ['yirmi beş', 'yirmibeş', 'yirmibes', '25'],
        27: ['yirmi yedi', 'yirmiyedi', '27'],
        28: ['yirmi sekiz', 'yirmisekiz', '28'],
        30: ['otuz', '30'],
        32: ['otuz iki', 'otuziki', '32'],
        35: ['otuz beş', 'otuzbeş', 'otuzbes', '35'],
        36: ['otuz altı', 'otuzaltı', 'otuzalti', '36'],
        40: ['kırk', 'kirk', '40'],
        45: ['kırk beş', 'kırkbeş', 'kirkbes', '45'],
        50: ['elli', '50']
      };
      const itemAliases = aliases[item.num] || [];
      for (const al of itemAliases) {
        if (!isMultiWord) {
          if (tokens.includes(al)) return true;
        } else if (text.includes(al) || textCompact.includes(al.replace(/\s+/g, ''))) {
          return true;
        }
      }
      return false;
    }

    function toggleRhythmAutoMic() {
      recordActivity();
      if (rhythmAutoMicEnabled) {
        // Kapat
        rhythmAutoMicEnabled = false;
        rhythmLastHeardText = '';
        stopChildVoiceCount();
        renderRhythmicCounting();
      } else {
        // Çocuk bir defa bastı: Sürekli dinleme modunu aktif et!
        rhythmAutoMicEnabled = true;
        rhythmLastHeardText = '🎙️ Mikrofon açıldı! Şimdi sıradaki sayıyı yüksek sesle söyle...';
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        // Eğer 1. basamaktaysa süreyi mikrofonu açtığı andan itibaren başlat
        if (rhythmPracticeTargetStep === 1 && !rhythmPracticeCompleted && rhythmPracticeStepStats.length === 0) {
          rhythmPracticeStartTime = Date.now();
        }
        startChildVoiceCount(true);
        renderRhythmicCounting();
      }
    }

    function stopChildVoiceCount() {
      if (rhythmAutoMicRestartTimer) {
        clearTimeout(rhythmAutoMicRestartTimer);
        rhythmAutoMicRestartTimer = null;
      }
      if (rhythmSpeechRecognizer) {
        try {
          rhythmSpeechRecognizer.onend = null;
          rhythmSpeechRecognizer.onerror = null;
          rhythmSpeechRecognizer.onresult = null;
          rhythmSpeechRecognizer.stop();
        } catch (e) {}
        rhythmSpeechRecognizer = null;
      }
      rhythmVoiceListening = false;
      rhythmConsumedResultIdx = -1;
      rhythmConsumedWordCount = 0;
    }

    function startChildVoiceCount(isAuto = false) {
      recordActivity();
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const info = rhythmData[rhythmActiveMode];
      if (!info) return;
      const currentItem = info.steps[rhythmPracticeTargetStep - 1];
      if (!currentItem || rhythmPracticeCompleted || rhythmActiveStage !== 'practice') {
        stopChildVoiceCount();
        return;
      }

      if (!SpeechRec) {
        if (!isAuto) {
          speakTurkish(`Yüksek sesle ${currentItem.tr} dedin, harikasın!`, 0.95);
          handleChildCountChoice(currentItem.num, null, true);
        }
        return;
      }

      if (!isAuto && !rhythmAutoMicEnabled) {
        // Kullanıcı doğrudan mikrofon butonuna bastıysa sürekli açık moda geçir
        toggleRhythmAutoMic();
        return;
      }

      if (rhythmVoiceListening && rhythmSpeechRecognizer) {
        return; // Zaten aktif dinliyor
      }

      try {
        stopChildVoiceCount();
        const rec = new SpeechRec();
        rec.lang = 'tr-TR';
        // HIZLI VE SÜREKLİ ALGILAMA: Sessizlik beklemeden anında yakalaması için interimResults=true ve continuous=true
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 5;
        rhythmSpeechRecognizer = rec;
        rhythmVoiceListening = true;
        rhythmConsumedResultIdx = -1;
        rhythmConsumedWordCount = 0;
        renderRhythmicCounting();

        rec.onresult = (event) => {
          const activeInfo = rhythmData[rhythmActiveMode];
          if (!activeInfo || rhythmPracticeCompleted || rhythmActiveStage !== 'practice') return;
          const targetItem = activeInfo.steps[rhythmPracticeTargetStep - 1];
          if (!targetItem) return;

          const latestIdx = event.results.length - 1;
          const latestResult = event.results[latestIdx];
          if (!latestResult) return;

          if (latestIdx !== rhythmConsumedResultIdx) {
            rhythmConsumedResultIdx = latestIdx;
            rhythmConsumedWordCount = 0;
          }

          const primaryFull = (latestResult[0].transcript || '').toLowerCase().trim();
          const primaryWords = primaryFull.split(/\s+/).filter(Boolean);
          if (primaryWords.length < rhythmConsumedWordCount) {
            rhythmConsumedWordCount = Math.max(0, primaryWords.length - 1);
          }

          // Yalnızca henüz işlenmemiş yeni kelimeleri al
          const newPrimaryWords = primaryWords.slice(rhythmConsumedWordCount);
          if (newPrimaryWords.length === 0) return;

          let recentCandidates = [newPrimaryWords.slice(-3).join(' ')];
          for (let i = 1; i < latestResult.length; i++) {
            const altTr = (latestResult[i].transcript || '').toLowerCase().trim();
            const altWords = altTr.split(/\s+/).filter(Boolean);
            recentCandidates.push(altWords.slice(-3).join(' '));
          }
          const heardDisplay = recentCandidates[0] || '';

          const nowMs = Date.now();
          if (rhythmLastVoiceStepMatched === rhythmPracticeTargetStep && (nowMs - rhythmLastVoiceMatchTime) < 300) {
            return;
          }

          const matched = recentCandidates.some(cand => doesTranscriptMatchRhythmItem(cand, targetItem));
          if (matched) {
            rhythmConsumedWordCount = primaryWords.length;
            rhythmLastVoiceStepMatched = rhythmPracticeTargetStep;
            rhythmLastVoiceMatchTime = nowMs;
            rhythmLastHeardText = `✅ "${targetItem.num} (${targetItem.tr})" duyuldu! Şimdi sıradaki sayıyı söyle!`;
            handleChildCountChoice(targetItem.num, null, true);
          } else if (latestResult.isFinal && heardDisplay) {
            // Az önce kabul edilen önceki basamağın gecikmeli final sonucuysa yoksay
            const prevItem = rhythmPracticeTargetStep > 1 ? activeInfo.steps[rhythmPracticeTargetStep - 2] : null;
            if (prevItem && doesTranscriptMatchRhythmItem(heardDisplay, prevItem)) {
              rhythmConsumedWordCount = primaryWords.length;
              return;
            }
            rhythmConsumedWordCount = primaryWords.length;
            rhythmLastHeardText = `🎙️ "${heardDisplay}" duyuldu. Sıradaki sayı: ${targetItem.tr} (${targetItem.num})`;
            renderRhythmicCounting();
          }
        };

        rec.onerror = (err) => {
          rhythmVoiceListening = false;
          rhythmSpeechRecognizer = null;
          if (err && (err.error === 'not-allowed' || err.error === 'service-not-allowed')) {
            rhythmAutoMicEnabled = false;
            rhythmLastHeardText = '⚠️ Mikrofon izni verilmedi. Lütfen mikrofon izni verin veya baloncuklara dokunun.';
            renderRhythmicCounting();
          } else if (rhythmAutoMicEnabled && rhythmActiveStage === 'practice' && !rhythmPracticeCompleted && currentMainTab === 'rhythmic') {
            rhythmAutoMicRestartTimer = setTimeout(() => startChildVoiceCount(true), 120);
          } else {
            renderRhythmicCounting();
          }
        };

        rec.onend = () => {
          rhythmVoiceListening = false;
          rhythmSpeechRecognizer = null;
          if (rhythmAutoMicEnabled && rhythmActiveStage === 'practice' && !rhythmPracticeCompleted && currentMainTab === 'rhythmic') {
            rhythmAutoMicRestartTimer = setTimeout(() => startChildVoiceCount(true), 100);
          } else {
            renderRhythmicCounting();
          }
        };

        rec.start();
      } catch (e) {
        rhythmVoiceListening = false;
        rhythmSpeechRecognizer = null;
      }
    }

      rhythmExamFirstTry = 0;
      rhythmExamWrongCurrent = 0;
      rhythmExamWrongClicked = [];
      rhythmExamAnswered = false;
      renderRhythmicCounting();
      if (rhythmExamQuestions[0]) {
        speakTurkish(rhythmExamQuestions[0].speakPrompt, 0.94);
      }
    }

    function answerRhythmExamOption(selectedOption) {
      recordActivity();
      if (rhythmExamAnswered) return;
      const q = rhythmExamQuestions[rhythmExamIndex];
      if (!q) return;

      if (selectedOption === q.correct) {
        rhythmExamAnswered = true;
        if (rhythmExamWrongCurrent === 0) {
          rhythmExamScore += 10;
          rhythmExamFirstTry++;
          rhythmExamStreak++;
          if (rhythmExamStreak > rhythmExamBestStreak) rhythmExamBestStreak = rhythmExamStreak;
        } else {
          rhythmExamScore += 5;
        }
        recordParentActivityLog('rhythm', `${q.stepSize}'er Ritmik Sınav: "${q.question}" ➔ ${q.correct}`, true);
        renderRhythmicCounting();
        speakTurkish(`Harika! Doğru cevap ${q.correct.split(' ')[0]}!`, 0.95);
      } else {
        if (!rhythmExamWrongClicked.includes(selectedOption)) {
          rhythmExamWrongClicked.push(selectedOption);
        }
        rhythmExamWrongCurrent++;
        rhythmExamStreak = 0;
        recordParentActivityLog('rhythm', `${q.stepSize}'er Ritmik Sınav: "${q.question}" (Seçilen: ${selectedOption}, Doğru: ${q.correct})`, false);
        renderRhythmicCounting();
        speakTurkish("Tekrar dikkatlice sayalım!", 0.95);
      }
    }

      recordActivity();
      rhythmExamIndex++;
      rhythmExamWrongCurrent = 0;
      rhythmExamWrongClicked = [];
      rhythmExamAnswered = false;
      renderRhythmicCounting();
      const q = rhythmExamQuestions[rhythmExamIndex];
      if (q) {
        speakTurkish(q.speakPrompt, 0.94);

        recordParentMilestone(`🏆 Ritmik Sayma Sınavı Tamamlandı (${rhythmExamScore} Puan)`);
